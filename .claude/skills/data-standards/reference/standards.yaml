# Taleemabad Data Standards v2 — machine-readable source of truth.
# Edit this file to change the standards; SKILL.md and scripts/*.py both read it.
# Products (fixed order, used as column keys everywhere): lesson_plans, digital_coach,
# teacher_training, exam_generator, user_mgmt, data_analytics.
#
# tier: non_negotiable | essential | advanced | specialized
# status: V1 | NEW | REVISED | REVISED (<note>)
# products.<key>.applies: false when the CSV said "Not applicable" / "-"
# detect: optional list of case-insensitive regex fragments used by scripts/audit.py's
#   keyword heuristic to flag a schema/migration/PR file as *possibly relevant* to a
#   standard. This is a heuristic pointer for a human/agent reviewer, not a certifier —
#   it cannot verify DB-level enforcement (constraints, RLS, CI checks). See SKILL.md
#   "What the audit script can and cannot check."

tiers:
  non_negotiable:
    label: "NON-NEGOTIABLE"
    tagline: "Ship nothing without these. Enforce now."
  essential:
    label: "ESSENTIAL"
    tagline: "The quality multipliers. Adopt next."
  advanced:
    label: "ADVANCED"
    tagline: "Compounding advantages. Earn the right."
  specialized:
    label: "SPECIALIZED"
    tagline: "Single-service or Phase 2. When ready."

verifiers:
  data_contract_reviewer: "Data Contract Reviewer"
  data_code_reviewer: "Data Code Reviewer"
  data_quality_analyzer: "Data Quality Analyzer"
  data_log_analyzer: "Data Log Analyzer"

products: [lesson_plans, digital_coach, teacher_training, exam_generator, user_mgmt, data_analytics]

standards:
  - id: D1
    tier: non_negotiable
    standard: "Unique Entity ID (UUID)"
    statement: >
      Every student, teacher, and school must have a system-wide unique identifier
      (UUID v4) that never changes.
    why_it_matters: >
      Prevents "fragmented profiles" where a teacher has different IDs across systems,
      making longitudinal tracking impossible.
    metrics:
      - "% of entities with UUID v4 configured"
      - "% of FKs not linking to UUID (e.g. FK to a name field)"
    verifier: data_contract_reviewer
    status: V1
    detect: ["uuid", "gen_random_uuid", "uuid_generate_v4"]
    products:
      lesson_plans: { applies: true, example: "Uses global TeacherID for all LP generation and tracking." }
      digital_coach: { applies: true, example: "Tags audio observations with global TeacherID and SchoolID." }
      teacher_training: { applies: true, example: "All training progress linked to global TeacherID." }
      exam_generator: { applies: true, example: "Exam results tagged with global StudentIDs and TeacherIDs." }
      user_mgmt: { applies: true, example: "Source of Truth. Generates and manages the unique ID registry." }
      data_analytics: { applies: true, example: "Joins all datasets using these canonical IDs for \"Golden Records.\"" }

  - id: D2
    tier: non_negotiable
    standard: "Shift-Left Validation"
    statement: >
      All user inputs (names, dates, scores) must be validated for type, range, and
      format at the point of entry.
    why_it_matters: >
      "Garbage in, garbage out." Prevents downstream logic failures and data corruption
      before they enter the pipeline.
    metrics:
      - "% of input fields not validated"
      - "% of attributes without validation / range limits"
    verifier: data_contract_reviewer   # also data_code_reviewer, per CSV
    verifiers: [data_contract_reviewer, data_code_reviewer]
    status: V1
    detect: ["check\\s*\\(", "not null", "regexp", "validate"]
    products:
      lesson_plans: { applies: true, example: "Validates that SLO codes entered match the SNC 2020 registry via dropdown." }
      digital_coach: { applies: true, example: "Validates audio metadata (duration, format) before upload." }
      teacher_training: { applies: true, example: "Quiz scores must be between 0-100; dates in ISO 8601." }
      exam_generator: { applies: true, example: "Item difficulty must be an integer within 1-5 range." }
      user_mgmt: { applies: true, example: "Blocks invalid mobile numbers (E.164) and malformed emails." }
      data_analytics: { applies: true, example: "Monitors validation failure rates as a proxy for UI quality." }

  - id: D3
    tier: non_negotiable
    standard: "Hard Referential Integrity"
    statement: >
      Foreign-key constraints and NOT NULL rules must be enforced at the database
      level, not at the application layer.
    why_it_matters: >
      Prevents "orphaned records" - e.g. a lesson plan existing for a teacher who was
      deleted from the system.
    metrics:
      - "Orphan Count: # of records in child tables without a parent"
      - "% of FK columns with DB-level NOT NULL + REFERENCES constraint"
    verifier: data_quality_analyzer
    status: V1
    detect: ["references\\s+\\w+\\s*\\(", "foreign key", "not null"]
    products:
      lesson_plans: { applies: true, example: "LP cannot be created without a valid, existing SLO_ID." }
      digital_coach: { applies: true, example: "Observation record cannot exist without a valid TeacherID." }
      teacher_training: { applies: true, example: "Training record must link to an existing ModuleID." }
      exam_generator: { applies: true, example: "Question cannot be saved without an associated SLO_ID." }
      user_mgmt: { applies: true, example: "Enforces that every user belongs to a valid School/Region." }
      data_analytics: { applies: true, example: "Reduces cleaning time by 40-60% by eliminating orphans." }

  - id: D4
    tier: non_negotiable
    standard: "PII Isolation & Masking"
    statement: >
      No raw PII (names, phone numbers, CNIC) should appear in logs, URLs, or
      non-core tables. Access governed by sensitivity classification.
    why_it_matters: >
      Student data is sacred. Minimizes the "blast radius" of breaches or accidental
      log leaks.
    metrics:
      - "Count of raw names/numbers found in logs (sampled weekly)"
      - "# of columns missing a sensitivity classification (see D6)"
    verifier: data_log_analyzer
    status: V1
    depends_on: [D6]
    detect: ["cnic", "phone", "\\bname\\b.*log", "console\\.log.*(name|phone|cnic)"]
    products:
      lesson_plans: { applies: false, example: "Not required (Internal)." }
      digital_coach: { applies: true, example: "Transcripts are scrubbed of student names before storage." }
      teacher_training: { applies: true, example: "Logs track ModuleID, not the trainee's personal contact info." }
      exam_generator: { applies: true, example: "URLs for results use encrypted tokens, not student names." }
      user_mgmt: { applies: true, example: "Enforces strict RBAC for viewing the primary PII registry." }
      data_analytics: { applies: true, example: "All analytics pipelines hash PII before any aggregation step." }

  - id: D5
    tier: non_negotiable
    standard: "Timestamps & UTC"
    statement: >
      Every table includes created_at and updated_at as TIMESTAMP WITH TIME ZONE,
      stored in UTC. Conversion to local time happens at the UI / report layer only.
    why_it_matters: >
      Without a UTC standard, joins across products silently break and AI agents
      cannot reason about "when". Already biting us in the migration pipeline.
    metrics:
      - "% of tables with both created_at and updated_at columns"
      - "# of TIMESTAMP WITHOUT TIME ZONE columns in production (must trend to 0)"
    verifier: data_contract_reviewer
    status: NEW
    detect: ["timestamp\\s*\\(", "timestamptz", "timestamp without time zone", "created_at", "updated_at"]
    products:
      lesson_plans: { applies: true, example: "LP tables include created_at / updated_at in UTC." }
      digital_coach: { applies: true, example: "Observation events stored as UTC TIMESTAMPTZ." }
      teacher_training: { applies: true, example: "Training progress timestamps stored in UTC." }
      exam_generator: { applies: true, example: "Exam attempt times stored in UTC." }
      user_mgmt: { applies: true, example: "User created_at / last_login_at in UTC." }
      data_analytics: { applies: true, example: "BigQuery layer consumes UTC; reports localize to PKT." }

  - id: D6
    tier: non_negotiable
    standard: "Data Classification & Sensitivity Labels"
    statement: >
      Every column tagged with one of: Public | Internal | Confidential | PII |
      Restricted-PII. The label, not the column name, drives MCP redaction and
      access control.
    why_it_matters: >
      D4 ("no raw PII") is unenforceable without defining what counts as PII.
      Provides the taxonomy that powers MCP-level redaction.
    metrics:
      - "% of columns with a sensitivity label"
      - "# of PII / Restricted-PII columns surfaced via MCP to non-PII consumers"
    verifier: data_contract_reviewer
    status: NEW
    enables: [D4, D20, D25]
    detect: ["sensitivity", "classification", "pii", "restricted-pii"]
    products:
      lesson_plans: { applies: true, example: "Lesson content = Internal; teacher notes = Confidential." }
      digital_coach: { applies: true, example: "Audio recordings = Restricted-PII." }
      teacher_training: { applies: true, example: "Training scores = Confidential." }
      exam_generator: { applies: true, example: "Exam responses = Confidential; student name = PII." }
      user_mgmt: { applies: true, example: "Source of truth. CNIC / phone = Restricted-PII." }
      data_analytics: { applies: true, example: "Enforces label-based access at the MCP / view layer." }

  - id: D7
    tier: non_negotiable
    standard: "Data Ownership & Stewardship"
    statement: >
      Every table, dataset, and data product has (a) an owning team and (b) one
      named human steward, recorded in a central metadata registry.
    why_it_matters: >
      Required to make data contracts (D18) enforceable. Without a known owner,
      nobody approves exceptions and nobody gets paged when quality drops.
    metrics:
      - "% of tables / datasets in catalog with a named owner team and steward"
      - "# of \"ownerless\" datasets in production (must be 0)"
    verifier: data_contract_reviewer
    status: NEW
    enables: [D18]
    detect: ["owner", "steward"]
    products:
      lesson_plans: { applies: true, example: "LP team owns lesson_plans.* tables." }
      digital_coach: { applies: true, example: "Coaching team owns coaching_observations.*" }
      teacher_training: { applies: true, example: "Training team owns teacher_training.*" }
      exam_generator: { applies: true, example: "Exams team owns exam_generator.*" }
      user_mgmt: { applies: true, example: "Identity team owns users / schools." }
      data_analytics: { applies: true, example: "Data & Analytics owns Silver and Gold layers; not Bronze." }

  - id: D8
    tier: non_negotiable
    standard: "Migration Framework"
    statement: >
      Every project must use an automated migration tool (Flyway, Alembic, Django
      Migrations, etc.). No hand-run SQL against production schemas.
    why_it_matters: >
      Manual SQL causes "schema drift" between Dev and Prod, leading to catastrophic
      deployment failures.
    metrics:
      - "Migration framework adopted: Yes/No per project"
      - "# of manual SQL changes in production in the last 30 days (must be 0)"
    verifier: data_code_reviewer
    status: REVISED
    enables: [D17]
    detect: ["flyway", "alembic", "django migrations", "knex migrate", "prisma migrate"]
    products:
      lesson_plans: { applies: true, example: "All schema changes for LPs are versioned in the LP git repo." }
      digital_coach: { applies: true, example: "Audio metadata schema updates are tracked and scripted." }
      teacher_training: { applies: true, example: "Training module schema updates are automated via CI/CD." }
      exam_generator: { applies: true, example: "Item bank schema changes are versioned and auditable." }
      user_mgmt: { applies: true, example: "User-role schema changes are fully scripted and tested." }
      data_analytics: { applies: true, example: "Allows reproducible staging environments for testing." }

  - id: D9
    tier: essential
    standard: "Soft Delete (No Hard Deletes)"
    statement: >
      Mutable entities use soft delete: a nullable deleted_at TIMESTAMPTZ column.
      Never DELETE rows, never rely on is_deleted alone.
    why_it_matters: >
      D3 (referential integrity) silently breaks when one team hard-deletes a row
      that another team's FK still references. Prerequisite for safe contracts.
    metrics:
      - "% of mutable tables with deleted_at column"
      - "# of hard-DELETE statements detected in production audit logs (target 0)"
    verifier: data_code_reviewer
    status: NEW
    prerequisite_for: [D3]
    detect: ["deleted_at", "\\bdelete from\\b", "is_deleted"]
    products:
      lesson_plans: { applies: true, example: "LPs are archived, never deleted." }
      digital_coach: { applies: true, example: "Observation records soft-deleted with deleted_at." }
      teacher_training: { applies: true, example: "Training enrolments soft-deleted, retain history." }
      exam_generator: { applies: true, example: "Exam questions soft-deleted; old exams remain readable." }
      user_mgmt: { applies: true, example: "Teacher deactivation = set deleted_at, not DELETE FROM users." }
      data_analytics: { applies: true, example: "Pipelines filter WHERE deleted_at IS NULL for \"active\" views." }

  - id: D10
    tier: essential
    standard: "Freshness SLA per Dataset"
    statement: >
      Every dataset declares: update frequency, max acceptable lag, and alerting
      threshold. Missing the SLA is an incident, not a surprise.
    why_it_matters: >
      The single biggest trust-builder for data-as-a-service. AI agents and
      dashboards must know "is this data 2 hours or 2 weeks old?" without asking.
    metrics:
      - "% of datasets with a declared freshness SLA"
      - "% of datasets meeting their SLA over a rolling 30-day window"
    verifier: data_quality_analyzer
    status: NEW
    detect: ["freshness", "sla", "lag"]
    products:
      lesson_plans: { applies: true, example: "lesson_plans.* refreshed hourly; lag SLA <= 2h." }
      digital_coach: { applies: true, example: "coaching_observations.* refreshed daily; lag SLA <= 24h." }
      teacher_training: { applies: true, example: "teacher_training.* refreshed daily; lag SLA <= 24h." }
      exam_generator: { applies: true, example: "exam_results.* refreshed every 6h; lag SLA <= 8h." }
      user_mgmt: { applies: true, example: "users / schools refreshed every 6h; lag SLA <= 8h." }
      data_analytics: { applies: true, example: "Publishes freshness dashboard per Gold-layer table." }

  - id: D11
    tier: essential
    standard: "Slow Query Hygiene & Indexing"
    statement: >
      Every table > 1M rows must have indices on watermark columns (created_at /
      updated_at) and all FK columns. Slow queries are reviewed weekly.
    why_it_matters: >
      Migration pipelines and AI agents both depend on watermark queries. Missing
      indices cause hours-long hangs (we have hit this in main.py).
    metrics:
      - "# of queries > 5s on production reads (rolling 7 days)"
      - "# of tables > 1M rows missing index on (created_at, updated_at, FK columns)"
    verifier: data_code_reviewer
    status: "NEW (was unfilled row in v1)"
    detect: ["create index", "create.*index.*on", "explain analyze"]
    products:
      lesson_plans: { applies: true, example: "Indexed on (school_id, created_at)." }
      digital_coach: { applies: true, example: "Indexed on (teacher_id, observation_at)." }
      teacher_training: { applies: true, example: "Indexed on (teacher_id, module_id, status)." }
      exam_generator: { applies: true, example: "Indexed on (exam_id, student_id)." }
      user_mgmt: { applies: true, example: "Indexed on (cnic), (phone) for identity-graph lookups." }
      data_analytics: { applies: true, example: "Monitors slow-query log; raises tickets on the owning team." }

  - id: D12
    tier: essential
    standard: "Backward-Compatible Migrations"
    statement: >
      All schema changes must allow old and new code to run simultaneously.
      "Breaking change" is defined explicitly in the Legend & Definitions tab.
    why_it_matters: >
      Enables zero-downtime deployments. Prevents system crashes during rolling
      updates.
    metrics:
      - "% of PRs with breaking changes in models"
      - "All schema PRs must include a \"breaking?\" checkbox + reviewer sign-off"
    verifier: data_code_reviewer
    status: REVISED
    related: [D17]
    detect: ["alter table.*drop", "rename column", "not null.*default"]
    products:
      lesson_plans: { applies: true, example: "Adding a \"Theme\" column to LPs includes a default value." }
      digital_coach: { applies: true, example: "Renaming an audio field uses an alias to support old apps." }
      teacher_training: { applies: true, example: "New quiz fields are optional until all users upgrade." }
      exam_generator: { applies: true, example: "Database updates allow old exams to remain readable." }
      user_mgmt: { applies: true, example: "Profile updates do not break existing auth sessions." }
      data_analytics: { applies: true, example: "Prevents \"Pipeline downtime\" caused by sudden source changes." }

  - id: D13
    tier: essential
    standard: "Idempotent Ingress (Upserts)"
    statement: >
      All data-writing endpoints must use upsert (insert or update on conflict)
      logic and accept an idempotency key for safe retries.
    why_it_matters: >
      Teachers in low-connectivity areas retry syncs often. Without idempotency,
      this creates duplicates that poison KPIs.
    metrics:
      - "% of duplicate rows for the same entity event"
      - "All write endpoints must accept an idempotency key"
    verifier: data_quality_analyzer
    status: V1
    detect: ["on conflict", "upsert", "idempotency"]
    products:
      lesson_plans: { applies: true, example: "Retrying an LP modification does not create a second LP." }
      digital_coach: { applies: true, example: "Multiple sync attempts for an observation update the same ID." }
      teacher_training: { applies: true, example: "Submitting a quiz twice only records the latest result." }
      exam_generator: { applies: true, example: "Syncing exam results handles duplicate packets gracefully." }
      user_mgmt: { applies: true, example: "Registering an existing user updates the current profile." }
      data_analytics: { applies: true, example: "Eliminates double-counting in engagement KPIs." }

  - id: D14
    tier: essential
    standard: "Semantic Naming Alignment"
    statement: >
      All teams use the shared Naming Guide: snake_case, plural tables, FK =
      <singular>_id, booleans prefixed is_/has_/can_, timestamps suffixed _at.
    why_it_matters: >
      Reduces confusion. An AI agent shouldn't need to guess that t_id and
      teacher_id are the same thing.
    metrics:
      - "Naming Adherence % (against published Naming Guide)"
      - "# of \"alias\" columns introduced per quarter (should trend down)"
    verifier: data_contract_reviewer
    status: V1
    counterpart: D15
    detect: ["\\bis_[a-z]+\\b", "\\bhas_[a-z]+\\b", "_id\\b", "_at\\b"]
    products:
      lesson_plans: { applies: true, example: "LP tables use standard prefixes for booleans (e.g. is_active)." }
      digital_coach: { applies: true, example: "Uses observation_at (TIMESTAMPTZ) - not observation_dt." }
      teacher_training: { applies: true, example: "Standardizes training status labels (e.g. COMPLETED)." }
      exam_generator: { applies: true, example: "Aligns Question naming with the SNC SLO registry." }
      user_mgmt: { applies: true, example: "Aligns role names (e.g. TEACHER, PRINCIPAL) across apps." }
      data_analytics: { applies: true, example: "Automatically maps source columns into Silver-layer entities." }

  - id: D15
    tier: essential
    standard: "Controlled Vocabulary (Enums & Lookups)"
    statement: >
      Categorical fields use Postgres ENUM types or a shared lookup table.
      Approved values live in a central catalog and are versioned.
    why_it_matters: >
      D14 governs column names; this governs column values. Without it, "Active" /
      "active" / "ACTIVE" / "1" all coexist and AI agents hallucinate.
    metrics:
      - "% of categorical columns backed by a Postgres ENUM or lookup table"
      - "# of categorical columns containing case-variants of the same value"
    verifier: data_contract_reviewer
    status: NEW
    counterpart: D14
    detect: ["create type.*as enum", "enum\\s*\\("]
    products:
      lesson_plans: { applies: true, example: "lesson_plan.status drawn from enum (DRAFT, PUBLISHED, ARCHIVED)." }
      digital_coach: { applies: true, example: "observation.rating drawn from rubric enum." }
      teacher_training: { applies: true, example: "training.status enum (NOT_STARTED, IN_PROGRESS, COMPLETED)." }
      exam_generator: { applies: true, example: "question.difficulty enum (1, 2, 3, 4, 5)." }
      user_mgmt: { applies: true, example: "user.role enum maintained centrally." }
      data_analytics: { applies: true, example: "Publishes enum catalog; validates Silver-layer columns against it." }

  - id: D16
    tier: essential
    standard: "Test Data Isolation"
    statement: >
      Test / QA / demo accounts and rows are flagged (is_test BOOLEAN) and excluded
      from analytics by default. Reserved username prefixes blocked in prod.
    why_it_matters: >
      #1 cause of "DAU is up 5%" being internal QA. Without this, every product
      KPI is silently contaminated.
    metrics:
      - "% of test accounts flagged with is_test = TRUE"
      - "# of analytics dashboards excluding is_test by default"
    verifier: data_quality_analyzer
    status: NEW
    detect: ["is_test", "test_", "demo_"]
    products:
      lesson_plans: { applies: true, example: "Test LPs flagged at creation time." }
      digital_coach: { applies: true, example: "Internal demo observations flagged is_test = TRUE." }
      teacher_training: { applies: true, example: "Training environment has separate is_test marker." }
      exam_generator: { applies: true, example: "Internal exam attempts flagged and excluded." }
      user_mgmt: { applies: true, example: "User table has is_test column; reserved prefixes (test_, demo_) blocked." }
      data_analytics: { applies: true, example: "All Gold-layer KPIs filter WHERE NOT is_test." }

  - id: D17
    tier: advanced
    standard: "Reversible Migrations"
    statement: >
      Every schema migration must have a tested "down" or "rollback" script.
      Rollback drills run quarterly in staging.
    why_it_matters: >
      If a deployment fails, the team can revert the database state in minutes
      without data loss.
    metrics:
      - "Presence of tested rollback (\"down\") migrations in each project"
      - "# of migrations rolled back successfully in staging in last quarter"
    verifier: data_code_reviewer
    status: "REVISED (D8 is now its prerequisite)"
    requires: [D8]
    detect: ["down\\(", "def downgrade", "rollback"]
    products:
      lesson_plans: { applies: true, example: "LP team can revert a \"Category\" split if it breaks the UI." }
      digital_coach: { applies: true, example: "Coach team can undo a rubric weight change instantly." }
      teacher_training: { applies: true, example: "Training team can revert module structure changes safely." }
      exam_generator: { applies: true, example: "Exam team can undo an item bank partition if needed." }
      user_mgmt: { applies: true, example: "Auth schema can be rolled back without locking out users." }
      data_analytics: { applies: true, example: "Ensures high \"Stability\" metric in the Data-as-Code pilot." }

  - id: D18
    tier: advanced
    standard: "Data Contract Enforcement"
    statement: >
      Each service maintains a version-controlled YAML data contract (schema +
      quality rules + ownership). CI/CD blocks PRs that violate it.
    why_it_matters: >
      Shifts governance "left". Blocks breaking changes in the product PR before
      they ever reach the warehouse.
    metrics:
      - "% of CI/CD builds that pass schema validation tests"
      - "# of breaking-change PRs merged without contract sign-off (must be 0)"
    verifier: data_contract_reviewer
    status: V1
    requires: [D7]
    detect: ["data contract", "contract.yaml", "contract.yml"]
    products:
      lesson_plans: { applies: true, example: "Contract defines mandatory SLO and SNC tag structure." }
      digital_coach: { applies: true, example: "Contract enforces valid ranges for confidence scores." }
      teacher_training: { applies: true, example: "Contract ensures training metadata matches the Master Catalog." }
      exam_generator: { applies: true, example: "Contract prevents unauthorized changes to Exam Item schemas." }
      user_mgmt: { applies: true, example: "Contract enforces Role-type validity for cross-app auth." }
      data_analytics: { applies: true, example: "Primary Verifier. CI/CD blocks PRs that violate the contract." }

  - id: D19
    tier: advanced
    standard: "Schema Deprecation Policy"
    statement: >
      Deprecated columns and tables remain available for >= 6 months with a
      sunset_at date in the metadata catalog. Consumers are notified at
      deprecation and 30 days before sunset.
    why_it_matters: >
      Without this, "backward compatible" means "we never delete anything" and
      the schema becomes a graveyard.
    metrics:
      - "# of deprecated columns/tables with sunset_at > today"
      - "# of consumers still reading a deprecated column past sunset_at"
    verifier: data_contract_reviewer
    status: NEW
    detect: ["sunset_at", "deprecated"]
    products:
      lesson_plans: { applies: true, example: "Deprecated LP columns kept 6 months, then removed." }
      digital_coach: { applies: true, example: "Deprecated rubric fields announced via change-log." }
      teacher_training: { applies: true, example: "Deprecated quiz formats migrated within 6 months." }
      exam_generator: { applies: true, example: "Old item-bank columns sunset on schedule." }
      user_mgmt: { applies: true, example: "Legacy username field deprecated post-CNIC adoption." }
      data_analytics: { applies: true, example: "Publishes deprecation calendar; rewrites Silver views before sunset." }

  - id: D20
    tier: advanced
    standard: "Audit Trail for Sensitive Data"
    statement: >
      High-sensitivity tables (any column tagged PII or Restricted-PII per D6)
      must log who read and who wrote, when, and what changed. Logs are
      immutable and retained >= 1 year.
    why_it_matters: >
      Required for compliance, breach response, and rebuilding trust after an
      incident. Maps to existing SchoolPilot audit_log / school_profile_audits
      tables.
    metrics:
      - "% of Confidential / PII / Restricted-PII tables with audit logging enabled"
      - "Audit logs retained >= 1 year and immutable (append-only)"
    verifier: data_log_analyzer
    status: NEW
    requires: [D6]
    detect: ["audit_log", "audit trail"]
    products:
      lesson_plans: { applies: false, example: "Not required (Internal)." }
      digital_coach: { applies: true, example: "Observation edits logged with editor + timestamp." }
      teacher_training: { applies: false, example: "Not required (Internal)." }
      exam_generator: { applies: true, example: "Exam result edits logged with editor." }
      user_mgmt: { applies: true, example: "All PII reads / writes logged." }
      data_analytics: { applies: true, example: "Audit log itself is governed; warehouse copy retained 7 years." }

  - id: D21
    tier: advanced
    standard: "Multi-Dimensional Data Quality"
    statement: >
      Every Gold-layer dataset publishes 4 quality dimensions weekly: Completeness,
      Validity, Uniqueness, Timeliness. Thresholds declared in the contract (D18).
    why_it_matters: >
      D3 catches orphans only. Real quality scorecards need completeness,
      validity, uniqueness, and timeliness - each measurable, each actionable.
    metrics:
      - "Completeness: % null in required columns"
      - "Validity: % rows passing range/format checks"
      - "Uniqueness: % duplicates on business keys"
      - "Timeliness: % rows older than freshness SLA"
    verifier: data_quality_analyzer
    status: NEW
    requires: [D18]
    detect: []
    products:
      lesson_plans: { applies: true, example: "Tracked on shared dashboard." }
      digital_coach: { applies: true, example: "Tracked on shared dashboard." }
      teacher_training: { applies: true, example: "Tracked on shared dashboard." }
      exam_generator: { applies: true, example: "Tracked on shared dashboard." }
      user_mgmt: { applies: true, example: "Tracked on shared dashboard." }
      data_analytics: { applies: true, example: "Owns and publishes the quality scorecard." }

  - id: D22
    tier: advanced
    standard: "Identity Graph Support"
    statement: >
      Systems must collect and provide secondary identifiers (Mobile #, CNIC,
      parent CNIC) where available, to enable probabilistic identity matching.
    why_it_matters: >
      Enables resolution of "Siloed Sam" profiles - students with multiple
      records due to re-enrollment, parent overlap, or data-entry errors.
    metrics:
      - "% of user entities with >= 1 secondary ID (CNIC, mobile, parent CNIC, etc.)"
      - "Match rate of probabilistic identity-graph resolution"
    verifier: data_contract_reviewer
    status: V1
    detect: ["identity graph", "parent_cnic", "secondary.*identifier"]
    products:
      lesson_plans: { applies: false, example: "Not applicable." }
      digital_coach: { applies: true, example: "Records secondary IDs during teacher registration." }
      teacher_training: { applies: false, example: "Not applicable." }
      exam_generator: { applies: true, example: "Collects parent phone numbers during exam distribution." }
      user_mgmt: { applies: true, example: "Maps all known identifiers (email, mobile, CNIC) to one profile." }
      data_analytics: { applies: true, example: "Builds the Identity Graph to resolve \"Siloed Sam\" profiles." }

  - id: D23
    tier: specialized
    standard: "Event Partitioning"
    statement: >
      All high-volume event tables (telemetry, usage, exam responses) must be
      partitioned by date or region.
    why_it_matters: >
      Prevents performance degradation. Without this, queries on 70M+ rows
      become unaffordable and slow.
    metrics:
      - "Partition coverage %: high-volume tables partitioned by date or region"
      - "# of un-partitioned event tables > 10M rows (must trend to 0)"
    verifier: data_quality_analyzer
    status: V1
    detect: ["partition by", "partitioned by"]
    products:
      lesson_plans: { applies: true, example: "Partitions \"LP Viewed\" events by Month." }
      digital_coach: { applies: true, example: "Partitions \"Audio Fragment\" events by TeacherID." }
      teacher_training: { applies: true, example: "Partitions \"Module Progress\" by Academic_Year." }
      exam_generator: { applies: true, example: "Partitions \"Student Response\" events by ExamID." }
      user_mgmt: { applies: false, example: "-" }
      data_analytics: { applies: true, example: "Mandatory. All Gold-layer event tables are partitioned." }

  - id: D24
    tier: specialized
    standard: "Bias Tagging for AI Training Sets"
    statement: >
      Datasets used to train or fine-tune AI must carry metadata for regional,
      linguistic, and grade-level diversity. Applies to curated training sets
      only, not all entities.
    why_it_matters: >
      Ensures AI tools do not perform worse for specific groups (e.g. Balochistan
      vs. ICT, Urdu vs. English MoI).
    metrics:
      - "% of curated AI training datasets missing bias-tag metadata"
      - "Disparity-analysis report published quarterly per AI model"
    verifier: data_contract_reviewer
    status: "REVISED (metric scope clarified)"
    detect: ["bias.tag", "disparity analysis"]
    products:
      lesson_plans: { applies: true, example: "Tags LP training sets with MoI (Medium of Instruction)." }
      digital_coach: { applies: true, example: "Tags audio training sets with regional dialect / accent." }
      teacher_training: { applies: false, example: "-" }
      exam_generator: { applies: true, example: "Tags questions by difficulty for fairness checks." }
      user_mgmt: { applies: false, example: "-" }
      data_analytics: { applies: true, example: "Performs \"Disparity Analysis\" to detect model bias." }

  - id: D25
    tier: specialized
    standard: "MCP Service Contract"
    statement: >
      MCP endpoints expose curated, versioned views - never raw tables. Each
      endpoint publishes a service contract: schema version, latency/availability
      SLO, rate limit, query budget, deprecation lifecycle.
    why_it_matters: >
      Data-as-a-service depends on consumer-facing contracts, not just internal
      schema contracts. Protects against runaway AI agents and cost blowouts.
    metrics:
      - "Every MCP endpoint declares: response schema version, SLO (latency, availability), rate limit, query budget"
      - "# of consumers exceeding their budget in last 30 days"
    verifier: data_contract_reviewer
    status: NEW
    requires: [D6]
    detect: ["mcp", "rate limit", "query budget"]
    products:
      lesson_plans: { applies: true, example: "Exposed via /lessons MCP endpoint." }
      digital_coach: { applies: true, example: "Exposed via /coaching MCP endpoint." }
      teacher_training: { applies: true, example: "Exposed via /training MCP endpoint." }
      exam_generator: { applies: true, example: "Exposed via /exams MCP endpoint." }
      user_mgmt: { applies: true, example: "Exposed via /identity MCP endpoint (PII-redacted)." }
      data_analytics: { applies: true, example: "Owns the MCP layer. Publishes contracts, monitors budgets, sunsets endpoints." }

  - id: D26
    tier: specialized
    standard: "Data Lineage & Provenance"
    statement: >
      Every derived column or dataset records its upstream source(s) and
      transformations. Lineage is queryable from the metadata catalog.
    why_it_matters: >
      When an AI agent gives a wrong answer, lineage cuts debugging from days to
      hours. Required for trust in Gold-layer outputs.
    metrics:
      - "% of Gold-layer columns with documented lineage to a Bronze source"
      - "Mean time to root-cause an incorrect AI answer (target < 1h)"
    verifier: data_contract_reviewer
    status: NEW
    detect: ["lineage", "dbt", "provenance"]
    products:
      lesson_plans: { applies: true, example: "Lineage maintained automatically via dbt-style tooling." }
      digital_coach: { applies: true, example: "Same." }
      teacher_training: { applies: true, example: "Same." }
      exam_generator: { applies: true, example: "Same." }
      user_mgmt: { applies: true, example: "Same." }
      data_analytics: { applies: true, example: "Owns the lineage system; surfaces lineage through MCP." }

  - id: D27
    tier: specialized
    standard: "Data Retention & Right-to-Be-Forgotten"
    statement: >
      Each dataset declares retention period (e.g. 7 years for student records,
      90 days for telemetry). Personal data has a documented "forget user X"
      workflow that cascades across systems.
    why_it_matters: >
      Regulatory and ethical requirement, especially for student data. Donor
      agreements often mandate this even when local law does not.
    metrics:
      - "Every dataset declares: retention period, archival policy, deletion process"
      - "# of \"forget user X\" requests completed within SLA"
    verifier: data_contract_reviewer
    status: NEW
    detect: ["retention", "right.to.be.forgotten", "forget user"]
    products:
      lesson_plans: { applies: true, example: "LPs retained 5 years; archived thereafter." }
      digital_coach: { applies: true, example: "Audio retained 2 years." }
      teacher_training: { applies: true, example: "Training records retained 7 years." }
      exam_generator: { applies: true, example: "Exam records retained 7 years." }
      user_mgmt: { applies: true, example: "Owns \"forget user\" workflow; cascades to all products." }
      data_analytics: { applies: true, example: "Honors deletion; rebuilds Silver / Gold layers." }
