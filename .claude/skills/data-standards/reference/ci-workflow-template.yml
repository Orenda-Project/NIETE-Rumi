# Data Standards gate (D1-D27) on every pull request and every push to the
# deploy branches. Same validator as the Claude hooks and the git hooks, from
# the vendored copy in .claude/skills/data-standards (owned by the Data Team in
# Orenda-Project/agent-skills-taleemabad; never edit it here).
#
# Runs on EVERY pull request, with no `paths:` filter: a required check with a
# paths filter never reports on a PR outside it, and GitHub then waits on it
# forever. The validator's own detector (.data-standards.json) decides what is
# a schema file; nothing relevant -> the job passes quietly.
#
# Fails the job on a confirmed violation (exit 1) or when the validator could
# not run (exit 2). It blocks a merge only once the check is marked required
# in branch protection. Checks set to `warn` in the skill's standards.yaml
# never fail the job: they are listed in the PR comment, as annotations and
# on the board as WARN, each with the reason it only warns. Problems already
# in a changed file before this PR are listed but never fail it.
#
# Reporting needs no secrets: every run goes to the data-gate board (endpoint
# and write-only key from telemetry.defaults), and the board posts it to the
# data team's Slack channel — every PR run with a schema change, and a push
# only when it fails or warns. No-schema runs are board-only.

name: data-standards

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: data-standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the one PR comment

env:
  SKILL: .claude/skills/data-standards

jobs:
  data-standards:
    name: data-standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for a real base..head diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Determine base/head
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
            # Diff from where the branch left its base, so other people's merges
            # to the base since then are not checked as this PR's changes.
            base=$(git merge-base "$base" "$head")
          else
            base="${{ github.event.before }}"; head="${{ github.sha }}"
            # A new branch or a force push has no usable "before".
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse "$head^" 2>/dev/null || echo "$head"); fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Run the validator (diff mode)
        id: validate
        run: |
          set +e
          python3 "$SKILL/scripts/validate_schema.py" --mode diff \
            --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}" > report.json 2> report.err
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat report.json; cat report.err >&2
          python3 "$SKILL/scripts/validate_schema.py" --mode diff \
            --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}" --markdown > report.md 2>/dev/null || true
          exit 0   # the last step decides pass/fail, so the steps in between always run

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-standards-report
          path: |
            report.json
            report.md
          retention-days: 30

      - name: Post or update the PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const code = '${{ steps.validate.outputs.exit_code }}';
            const marker = '<!-- data-standards-gate-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            // No schema change and nothing said before: stay quiet.
            if (code === '3' && !existing) return;
            let md = '';
            try { md = fs.readFileSync('report.md', 'utf8'); } catch (e) {}
            let report = {};
            try { report = JSON.parse(fs.readFileSync('report.json', 'utf8')); } catch (e) {}
            const warned = code === '0' && (report.warnings || []).length > 0;
            const header = warned
              ? '⚠️ **Data Standards** — passed with warnings. They do not block; each one says why.'
              : {
              '0': '✅ **Data Standards** — no blocking violations.',
              '1': '❌ **Data Standards** — confirmed violation(s). Fix them and push again.',
              '3': '✅ **Data Standards** — no schema changes left in this PR.',
            }[code] || '⚠️ **Data Standards** — the validator could not run. Treated as blocking.';
            const body = `${marker}\n${header}` + (md && code !== '3' ? `\n\n${md}` : '') +
              `\n\n_Commit \`${'${{ steps.refs.outputs.head }}'.slice(0, 7)}\`. Full report: the "data-standards-report" artifact on this run._`;
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Report to the data-gate board (and through it, Slack)
        if: always()
        continue-on-error: true
        env:
          # Optional: telemetry.defaults normally carries the write-only key.
          TALEEMABAD_GOVERNANCE_KEY: ${{ secrets.TALEEMABAD_GOVERNANCE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys
          code = "${{ steps.validate.outputs.exit_code }}"
          try:
              report = json.load(open("report.json"))
          except Exception:
              report = {}
          result = {"0": "PASS", "1": "FAIL", "3": "NOT APPLICABLE"}.get(code, "ERROR: validator could not run")
          findings, warnings = report.get("findings", []), report.get("warnings", [])
          if result == "PASS" and warnings:
              result = "PASS WITH WARNINGS"  # the board counts PASS* as a pass
          files = report.get("files_checked") or sorted({f.get("path", "") for f in findings} - {""})
          pr_number = "${{ github.event.pull_request.number }}"
          cmd = [sys.executable, os.path.join(os.environ["SKILL"], "scripts", "notify.py"), "governance",
                 "--repo", "${{ github.event.repository.name }}",
                 "--branch", "${{ github.head_ref || github.ref_name }}",
                 "--base-sha", "${{ steps.refs.outputs.base }}", "--head-sha", "${{ steps.refs.outputs.head }}",
                 "--actor", "${{ github.actor }}", "--result", result,
                 "--report-ref", f"pr:#{pr_number}" if pr_number else "${{ github.event_name }}"]
          if pr_number:
              cmd += ["--pr", "${{ github.event.pull_request.html_url }}"]
          if files:
              cmd += ["--changed-files", ",".join(files)]
          if findings or warnings:
              cmd += ["--issue-ids", ",".join(sorted({f.get("standard", "") for f in findings + warnings} - {""})),
                      "--summary", report.get("summary") or "; ".join(
                          f"{f.get('standard')} {f.get('path')}" + (f" table {f['table']}" if f.get("table") else "")
                          + f": {f.get('finding')}" for f in findings)]
          slack = bool(pr_number) or not result.startswith(("PASS", "NOT APPLICABLE"))
          env = {**os.environ, "TALEEMABAD_GATE_SLACK_VIA_BOARD_IN_CI": "1" if slack else "0"}
          out = subprocess.run(cmd, capture_output=True, text=True, env=env)
          print(out.stdout[-2000:]); print(out.stderr[-2000:], file=sys.stderr)
          PYEOF

      - name: Gate on the result
        run: |
          code="${{ steps.validate.outputs.exit_code }}"
          python3 - <<'PYEOF'
          import json
          try:
              report = json.load(open("report.json"))
          except Exception:
              report = {}
          for f in report.get("warnings", []):
              print(f"::warning file={f.get('path')}::{f.get('standard')} (does not block): {f.get('finding')} "
                    f"Why only a warning: {f.get('why')}")
          PYEOF
          case "$code" in
            0) echo "Data Standards: PASS." ;;
            3) echo "Data Standards: no schema-relevant change — nothing to check." ;;
            1) echo "::error::Confirmed Data Standards violation(s) — see the PR comment and report artifact."; exit 1 ;;
            *) echo "::error::The validator could not run (exit $code) — failing closed."; exit 1 ;;
          esac
