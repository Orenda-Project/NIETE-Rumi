# Fixtures for the NIETE WhatsApp e2e scenarios.
# Expected values the agent asserts against — kept out of the .feature so specs
# stay readable and data changes don't touch the scenarios.

menu:
  expected_rows:            # /menu → View Features (order-independent set)
    - Teacher Training
    - Lesson Plans
    - Classroom Coaching
    - Ask Anything
  must_not_contain:
    - Reading Assessment
  body_must_not_mention:    # F1 (@known-fail) until whatsapp.service.js:1884 fixed
    - reading assessment

portal:
  url_matches: "portal.niete.edu.pk/portal/login"

# Language feature (OPS-118 unification, grounded on NIETE-Rumi `develop`).
# ICT offers exactly two languages; the picker is registry-driven (getOfferedLanguages).
language:
  offered:                  # /language picker rows — EXACTLY these, in this order
    - title: "اردو"          # lang_ur  (LANGUAGE_OFFER[0] — the offered default)
      code: ur
    - title: "English"      # lang_en
      code: en
  default_offer: ur         # offerDefaultLanguage() — new-teacher / pre-select
  emergency_floor: en       # DEFAULT_LANGUAGE — only when nothing is determinable
  must_not_offer:           # removed on develop — a match here is a regression (was F3)
    - Auto-detect
    - پنجابی
    - سنڌي
    - پښتو
    - بلوچی
    - தமிழ்
    - العربية
    - Español
  picker:                   # @copy — exact chrome (via resolveUx, bilingual)
    button: "Languages"
    header: "Select Language / زبان منتخب کریں"
    footer: "/language — change anytime · کسی بھی وقت تبدیل کریں"
    section_title: "Available Languages"
  confirm:                  # @copy — the confirmation, rendered IN the chosen language
    en: "✅ Language set to English. I will now respond in English."
    ur: "✅ زبان اردو میں تبدیل ہو گئی۔ اب میں اردو میں جواب دوں گی۔"
  write_error: "Sorry, there was an error updating your language preference. Please try again."
  coaching_block:           # /language during an active coaching session
    en: "You can change language after the coaching session completes."
  settings:                 # /settings success-screen confirm (resolveUx, chosen language)
    saved_ur: "آپ کی سیٹنگز محفوظ ہو گئی ہیں۔"
    saved_en: "Your settings have been saved."
    not_available: "That language is not available. Please choose from the list."
  # Propagation matrix on an Urdu account (assert reply SCRIPT, not wording):
  localized_surfaces:       # SHOULD render Urdu → these are positive @e2e
    - ask-anything
    - observe
    - reading-assessment
    - settings
    - lesson-plan-natural-language
    - lesson-plan-feedback-survey
    - coaching-photo-and-lp-interstitials
    - training-entry-launcher
  english_leak_surfaces:    # STILL render English on Urdu (@known-issue → flip when fixed)
    - menu                  # list ignores language (whatsapp.service.js:1892-1932)
    - status                # reads no language at all
    - lesson-plan-pick-class-flow   # F-LP-i18n
    - lesson-plan-pregen-ack        # F-LP-i18n
    - teacher-training-inner-screens # F-TRAIN-i18n
    - coaching-steps-1-to-5         # bd-2479 (catalog EN-only sentinels)
    - attendance                    # no i18n layer
    - registration-greeting         # F-REG1 / bd-2480 (also drops the name)
    - registration-launch-bubble

# Registration onboarding Flow (added 2026-08-19, bd-2768 — this section did not exist,
# so registration.feature carried its expected strings inline and drifted from the code).
# Grounded in registration-endpoint.js + text-message.handler.js.
registration:
  entry:
    command: "/register"                 # case-insensitive (text-message.handler.js:1645)
    welcome_body: "Quick setup — tell us a little about you."
    welcome_cta: "Get started"
  # Screen order. PK gets the region step; everyone else skips it.
  screens:
    personal_info:   { collects: [full_name, country] }   # language screen removed from the Flow (product decision 2026-09-03)
    region_info:     { collects: [region], only_when: "country == Pakistan" }
    professional_info:
      collects: [organization, school_name, grade, subjects, role]
      mandatory: [organization]          # :256 — the others fall back to null / '' / []
    org_details:     { collects: [organization_name], only_when: "organization == other" }
    success:         {}
  # Exact validation copy (registration-endpoint.js:161, :165, :257, :337)
  validation:
    name: "Name is required"
    country: "Country is required"
    organization: "Organization is required"
    organization_name: "Please enter your organization name"
  completion:
    greeting_template: "Thank you for registering, <name>!"
    # ⚠️ F-REG1 is OPEN: the live greeting arrives with an EMPTY name. Assert the template
    # only once that bug is fixed; until then the @known-fail scenario owns this string.
    portal_setup_path: "/portal/setup/"   # assert the PATH; the HOST is environment-specific
    # prod -> portal.niete.edu.pk · staging -> the Railway app host. Never pin the host.
  already_registered:
    # TWO code paths, DIFFERENT trailing copy. Match the shared prefix, not the tail.
    common_prefix: "You're already registered,"
    variants:
      - "You're already registered, <name>! What would you like to do next?"    # :1651
      - "You're already registered, <name>! Type /menu to see what I can help you with."  # :1956
    gate: "user.first_name"              # NOT registration_completed / registration_state
  partial_state_ttl_seconds: 3600        # registration-endpoint.js:49 REDIS_TTL
  # Language offer on the personal-info screen is registry-driven — reuse `language.offered`
  # above rather than restating it here.

# Teacher Training native-Flow navigation labels (verified live on PROD 2026-08-04).
# Progress counts (e.g. "1/36", "1/9") drift as the account advances — match the
# STRUCTURE (program name, level titles, lock badges), not the exact numbers.
training_flow:
  program: "NIETE"                     # Choose-a-program row (…"4 levels · N% · x/36 courses")
  levels:
    - title: "Level 0 · Aspiring Teacher"      # 📖 in-progress ("N/9 courses · M% done")
      state: in_progress
    - title: "Level 1 · Emerging Practitioner" # 🔒 "Unlocks after Level 0 exam"
      state: locked
    - title: "Level 2 · Skilled Practitioner"  # 🔒 "Unlocks after Level 1 exam"
      state: locked
    - title: "Level 3 · Teacher Leader"        # 🔒 "Unlocks after Level 2 exam"
      state: locked
  grand_quiz_locked_text: "Grand Quiz — Unlocks when all courses are complete"

# Module checks are RANDOMIZED from a question pool (verified live 2026-08-04: a
# retake of "Diverse learners in classroom" served different questions). So this
# answer key is ILLUSTRATIVE, not exhaustive — the driver must read each question
# + options and pick the pedagogically-correct one (e.g. quiet-but-understands →
# "shy or introverted"; learns-by-listening → "auditory learner"; diverse needs →
# "varied teaching methods"). Content bug seen: one question rendered 5 options
# because the correct answer's text was split in two (A + a stray "…and hands-on
# activities" option).
#
# Level 0 module "Inclusive Classroom" — sample answer key (module 1).
training_quiz:
  # RESOLUTION CONTRACT (for @content-driven training scenarios — output is non-deterministic):
  #  • Match a served question to an entry by `question_contains` (substring, case-insensitive).
  #  • CORRECT option = the served option whose text contains `correct_contains` (substring) —
  #    select by TEXT, never by letter/index (options are shuffled per attempt).
  #  • FORCED-WRONG option (fail tests) = any served option NOT containing `correct_contains`
  #    (prefer one containing `wrong_contains` when present). Never "option A".
  #  • Served set is a per-attempt sample (one_per_bloom, floor 2, ~3) — this key is
  #    ILLUSTRATIVE, NOT exhaustive. If a served question has no entry here, the driver reasons
  #    the pedagogically-correct option from the text and (optionally) appends it back here.
  #  • Assert SHAPE not counts: score is "<got>/<total>", pass needs 100% (NIETE) — never a fixed "3/3".
  resolution: content_driven_substring_match
  module: "Inclusive Classroom + Group activity (Level 0)"   # entries span multiple modules; matched by question_contains
  answers:
    # ── Module "Inclusive Classroom" ──
    - question_contains: "not considered a diverse learner"
      correct_contains: "loves participating in sports"
      wrong_contains: "learning difficulties"
    - question_contains: "include examples from all cultures"
      correct_contains: "represented and included"
      wrong_contains: "majority culture"
    - question_contains: "visual and auditory learners"
      correct_contains: "audio-visual"       # "audio-visual materials and interactive activities"
      wrong_contains: "only slides"
    # ── Module "Group activity" (grouping strategy — CONFIRMED live on PROD 2026-08-05 via a
    #    fail→retry that resolved these four to a 3/3 pass). Theme: "targeted" skill work →
    #    ABILITY (homogeneous) grouping; participation/problem-solving → mixed-ability + peer support.
    - question_contains: "targeted math task"                     # "...best address their varying skill levels?"
      correct_contains: "Homogeneous"                             # "Homogeneous groups"
      wrong_contains: "Heterogeneous"
    - question_contains: "help struggling students the most in a targeted math session"
      correct_contains: "similar math proficiency"                # "Group students by similar math proficiency levels."
      wrong_contains: "Mix students of different"
    - question_contains: "improve their problem-solving skills"
      correct_contains: "varied skill levels to encourage peer support"
      wrong_contains: "competition-based"
    - question_contains: "struggle with group discussions"        # "...improve their participation?"
      correct_contains: "quieter students as leaders"             # "Form mixed ability groups with quieter students as leaders"
      wrong_contains: "Group them with friends"
  pass_text: "Module check — passed"
  locked_level_text: "Pass Level 0's grand quiz first to unlock this level."
  wrong_answer_text: "not quite"
  # A well-formed but nonexistent certificate code (CERT_CODE_RE) for the not_found test.
  unknown_certificate_code: "NIETE-L0-20260101-ZZZZ"

# Lesson Plans — code-grounded 2026-08-06 (NIETE-Rumi) + verified live PROD 2026-08-04/05.
lesson_plan:
  # Entry points (NO "/lesson-plan" command exists):
  entries:
    keyword_regex: "^(lp|lesson\\s*plan|لیسن\\s*پلان|lesson-plan|/lp)$"   # exact match only (text-message.handler.js:847)
    ice_breaker: "Plan Lesson - Create PDF lesson plans instantly"        # register-commands-meta.js:55
  # Launch bubble differs by entry (both gated on PAKISTAN_LP_FLOW_ID — set on PROD):
  menu_header: "📘 Lesson Plans"
  menu_cta: "Pick a class"                                               # menu.service.js:296
  menu_body_contains: "Pick your class, subject, chapter and topic — the lesson plan lands in your chat."
  keyword_cta: "Browse"                                                   # text-message.handler.js:867 (ur: "شروع کریں")
  keyword_body_contains: "Pick your class, subject, and chapter — I will send the lesson plan to your chat."
  grades: ["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9","Grade 10"]
  # Flow screens (English-only) — titles · heading/body · footer button (pakistan-lp-flow-v2.json):
  flow_screens:
    select_grade:   { title: "Select Class",   heading: "Which class?", body: "Pick the grade you teach.", field: "Class / Grade", button: "Next" }
    select_subject: { title: "Select Subject",  body: "Choose a subject.",  button: "Next" }
    select_chapter: { title: "Pick a Chapter",  body: "Pick a chapter.",    button: "Next" }      # chapter labels: "Ch <n>: <title>"
    select_topic:   { title: "Pick a Topic",    body: "Pick a topic — the lesson plan will land in your chat shortly.", button: "Send Lesson Plan" }
    success:        { title: "Lesson Plan On The Way", heading: "Sent!", body_contains: "Check your chat — the PDF will arrive", button: "Done" }
  # A known-good drill-down that delivers a PDF (grade 1 = pakistan corpus):
  happy_path: { grade: "Grade 1", subject: "English", chapter: "Ch 1: Hello World", topic: "Full Chapter Lesson Plan" }
  # Delivery acks (the middle is resolved live; assert the fixed prefix):
  delivering_text: "📘 Sending your lesson plan"        # pakistan (grades 1–5) → e.g. "Hello World — English.pdf"
  delivering_text_oxbridge: "📖 Sending your Oxbridge lesson plan"   # grades 6–10 → "Oxbridge — <chapter> — Lesson Plan.pdf"
  # Natural-language path (NOT the Flow — AI/Gamma generation, slower):
  natural_language_text: "I'm preparing a detailed five-step lesson plan for you. Please wait a moment"
  nl_pdf_caption_prefix: "✅ Your lesson plan is ready!"   # lesson-plan-generation.worker.js:36
  # First-use consent (feature-keyword-detector.service.js):
  consent_question: "I can create detailed lesson plans for you! Want to see how? 🎥"
  consent_buttons: ["Show me!", "Maybe later", "Just tell me"]
  just_tell_me_reply: "No problem! Just tell me what you want to teach (subject, topic, grade level), and I'll create a detailed 5-step lesson plan with activities."
  # Oxbridge NL picker (lesson-plan-v2.handler.js:152 / oxbridge-lp.service.js:243):
  oxbridge_picker_prefix: "📚 We have an Oxbridge lesson plan matching"
  oxbridge_picker_buttons: ["Oxbridge LP", "Generate NIETE LP"]
  # Post-delivery feedback survey (lp-feedback.service.js; 30s after every LP, reason window 600s):
  feedback_prompt: "Hope that lesson plan helps for your class! Was it useful for planning?"
  feedback_buttons: ["👍 Yes, useful", "👎 Not really"]
  feedback_thanks_yes: "Thanks — glad it helped!"
  feedback_ask_reason: "Thanks for letting us know. What didn't work? (one line is enough)"
  feedback_reason_ack: "Got it, thanks — this helps us improve the plans."
  # Curriculum-grounded ack (lesson-plan-v2.handler.js:109):
  curriculum_ack_prefix: "📝 Preparing your lesson plan on"
  # Error / empty messages (pakistan-lp-endpoint.js):
  empty_grade_text: "No lesson plans available for Grade"       # :139  "…yet. Try another class or check back soon."
  empty_subject_text: "No"                                     # :177  "No <subject> lesson plans for Grade <n> yet."
  r2_missing_text: "That lesson plan is not available right now."   # :268/:289
  generation_failed_text: "I'm sorry, there was a problem creating your lesson plan."   # worker:38
  account_not_found_text: "Sorry, I could not find your account. Please send me a message first"
  # Flow validation (English-only):
  validation: { grade: "Please select a class.", subject: "Please select a subject.", chapter: "Please pick a chapter.", topic: "Please pick a topic." }

  # ─────────────────────────────────────────────────────────────────────────────
  # 2026-08-12 STAGING RUN — PR #178 (bd-2540: strip teacher-triggerable Gamma LP paths)
  # Driven on staging (923222482222) via Chrome-MCP. Deltas vs the PROD-verified spec above:
  # ─────────────────────────────────────────────────────────────────────────────
  post_178:
    # The teacher NATURAL-LANGUAGE Gamma generation (natural_language_text / nl_pdf_caption_prefix
    # above) is REMOVED on staging. A free-text LP request now returns the CURRICULUM FALLBACK.
    # (PROD still generates via Gamma until #178 promotes — so the NL/feedback scenarios stay
    #  valid on prod and become the fallback below once #178 is live on prod.)
    nl_removed: true
    # Observed live 2026-08-12 (assert SHAPE: "not in our collection → type menu", not wording):
    curriculum_fallback_ur: 'یہ سبق ابھی ہمارے نصابی مجموعے میں دستیاب نہیں۔ دستیاب سبق دیکھنے کے لیے "menu" لکھیں۔'
    curriculum_fallback_assert: "lesson not in our curriculum collection yet → prompts to type menu"
    # Feedback prompt: the 👍/👎 survey NEVER fired on the Flow path (deliverPakistanLpAsync doesn't
    # call scheduleFeedbackPrompt — confirmed by grep + verified 2026-08-06, i.e. pre-#178). It only
    # ever fired on the NL/Gamma + curriculum-text paths. So post-#178 (NL stripped, curriculum gated
    # off on staging) NO feedback prompt is reachable on staging's surviving LP path — by design.
    feedback_reachable_on_staging: false
    # /lesson plan (slash + SPACE) is NOT in keyword_regex (only /lp is) → falls to NL → fallback.
    # bd-2490 candidate: add "/lesson\\s*plan" so it opens the Flow like /lp.
    unrecognized_slash_variant: "/lesson plan"

  # Voice entry (added 2026-08-12): a voice note asking for a lesson plan.
  voice_request_fixture: ".claude/qa/fixtures/whatsapp/niete/media/lp_request_voice.ogg"   # 1.6s opus, ~6 KB
  # ⚠ SYNTHETIC: macOS "Lekha" TTS reading Devanagari "मुझे लेसन प्लान बना दो" (= "make me a lesson plan").
  #   Send via Attach ▸ Audio → WhatsApp renders it as a TRUE PTT voice message. Transcription of a
  #   synthetic clip may be imperfect — for a definitive result, re-record with a real human voice note.
  voice_request_intent: "make me a lesson plan"
  # Expected CONTRACT: voice transcribed → routed to LP (same as the text path → post-#178 curriculum fallback).
  # 🐞 F-LP-VOICE (observed staging 2026-08-12): instead, the voice pipeline THREW — bot replied with an
  #   ERROR VOICE NOTE + an unsupported-type text. Root strings:
  voice_bug_2026_08_12:
    error_voice_ur: "معذرت، آواز پیغام پر کارروائی کرتے وقت خرابی آ گئی۔"      # voice-message.handler.js:1196 (outer catch)
    unsupported_text_ur: "میں صرف متن اور آواز پیغامات کا جواب دے سکتا ہوں۔"   # whatsapp-bot.js:1790 (unsupported message type)
    prod_health: "PROD voice healthy (24h → 2026-08-12): 244 'Voice message processing completed', 0 'Error processing voice message' → staging-scoped / possibly synthetic-clip"
    axiom_note: "staging NIETE does NOT ship to the digital-coach-logs Axiom dataset (driver number absent 2h) — trace staging via Railway, not Axiom"

  # Pic-to-LP silent drop (🐞 F-LP-PIC, observed staging 2026-08-12): with PIC_LP_FLOW_ID unset, a photo
  # of a textbook page gets NO reply AT ALL — not even the 'text and voice only' unsupported fallback.
  # Images reach the pic-to-LP handler, which no-ops when the flow is off, so they never hit that fallback.
  # UX dead-end; if the feature is off it should still send SOMETHING. Confirmed twice (idle + retry).
  pic_lp_silent_drop_when_gated: true

# Classroom Coaching — audio upload + FICO/ICT analysis (verified live 2026-08-04).
coaching:
  menu_prompt_contains: "upload your classroom recording"
  min_minutes: 15
  # Classroom fixtures (Attach → Document; the Audio item fails under Chrome-MCP). All derived from
  # the one sanctioned real recording (hameeda) — do NOT repurpose real teachers' DB recordings (privacy, Rule 1).
  audio_fixture: ".claude/qa/fixtures/whatsapp/niete/media/hameeda_classroom.m4a"        # 25 MB, ~1575s (~26 min) — TRIGGERS "Long Lesson Detected" (10+ min analysis)
  audio_fixture_fast: ".claude/qa/fixtures/whatsapp/niete/media/hameeda_16min.m4a"       # 3.9 MB, 960s (16:00), mono 32k — passes the ≥15-min gate; ~6× smaller/faster; PREFER for driving S4/S5 to the report

  # Classroom gate (code constant): CLASSROOM_AUDIO_THRESHOLD = 900s = 15 min
  # (voice-message.handler.js:725 & whatsapp-bot.js:1774). >=900 → classroom coaching; <900 → normal voice.
  classroom_threshold_seconds: 900
  # SHORT-audio fixture slot for the negative "under-15-minute recording does not start a coaching
  # analysis" scenario (coaching.feature). ⚠️ FILE NOT PRESENT YET — add a real short clip here.
  # HARD CONSTRAINTS (else the test is invalid):
  #   • duration STRICTLY < 900s (aim ~5-10 min so it's clearly a "short" clip)
  #   • file size < 500_000 bytes — the handler's ffprobe safety-net (voice-message.handler.js:735-761)
  #     re-probes real bytes and can PROMOTE a >=500KB clip to classroom even if WA under-reports duration.
  short_audio_fixture:
    path: ".claude/qa/fixtures/whatsapp/niete/media/hameeda_short.m4a"   # 460 KB, 210s (3:30), mono 16k — trimmed from hameeda
    max_duration_seconds: 899
    max_bytes: 500000
    present: true                        # ✅ added 2026-08-06: 210s (<900) AND 460 KB (<500 KB) → won't be promoted by the ffprobe safety-net
  # Expected CONTRACT for a <15-min upload (assert shape, not exact copy — not yet driven live):
  #   • NO coaching pipeline: none of detection_text_re / confirm_button / progress_steps appear
  #   • the clip is handled gracefully as an ordinary voice message (transcribe → conversational reply)
  #   • there is currently NO explicit "too short, send 15+ minutes" rejection (candidate UX fix)
  short_audio_must_not_contain:
    - "I detected a"          # detection card
    - "Yes, Analyze"          # confirm button
    - "Step 1/5"              # pipeline start
  # NON-DETERMINISTic: the detected duration varies with the uploaded file — match the
  # PATTERN, never a fixed "26". (@content-driven — see non-determinism-contract.md.)
  detection_text_re: "^I detected a \\d+-minute audio recording"          # regex; N = whatever was uploaded
  detection_text_template: "I detected a <N>-minute audio recording"      # human-readable shape
  confirm_button: "Yes, Analyze"
  # After "Yes, Analyze" the pipeline emits 5 numbered progress steps AND two
  # optional-context prompts (verified live 2026-08-04). Steps advance ~1 min apart;
  # a long (~26-min) recording triggers a "Long Lesson Detected" warning and 10+ min.
  progress_steps:
    - "Step 1/5: Transcribing your classroom audio"
    - "Step 2/5: Analyzing your teaching using research-based pedagogical frameworks"
    - "Step 3/5: Let's reflect on your teaching together"
    # Step 4/5 and 5/5 not yet observed (worker still running past step 3 in-run).
  long_lesson_warning: "Long Lesson Detected"
  # Two interstitial optional-context prompts BETWEEN transcription and analysis.
  # NOTE (F-COACH1): rendered in URDU with ہاں/نہیں buttons even on an English account.
  interstitial_prompts:
    - urdu: "کیا آپ اپنی کلاس روم کی تصویر شیئر کرنا چاہیں گے؟"   # "Share a classroom photo?"
      buttons: ["ہاں", "نہیں"]                                     # Yes / No
    - urdu: "کیا آپ کے پاس اس کلاس کا سبق کا منصوبہ ہے؟"          # "Do you have a lesson plan?"
      buttons: ["ہاں", "نہیں"]
  decline_lesson_plan_text: "No problem! I'll analyze your classroom audio without the lesson plan."
  # Final feedback (async, 10+ min for long lessons) references the FICO/ICT rubric — @wip @slow.
  rubric_terms: ["FICO", "indicator", "strength", "recommend", "observation"]

# Classroom Observation (/observe) — coach/officer persona. Entry + scheduling path
# verified LIVE on PROD 2026-08-04 (coach role set via registration "Your Role"=Coach).
# capture/FICO/debrief/send copy stays confirm_live (not driven — needs a throwaway teacher).
# Classroom Observation (/observe) — coach/officer persona.
# MERGED 2026-08-06: this used to be TWO top-level `observe:` keys — the second silently
# overrode the first at YAML load, discarding all the verified copy below. Now one block:
# verified LIVE copy (entry + scheduling, driven 2026-08-04) + code-grounded structural facts.
# Capture/FICO/debrief/send copy stays `confirm_live` (needs a throwaway teacher).
observe:
  # ---- verified LIVE on PROD 2026-08-04 (coach role via registration "Your Role"=Coach) ----
  deny_role: "/observe is for school leaders (field officers) for now."   # + 💛 + "If you're a teacher, I'm here for you — type \"menu\" to see what I can do."
  onboarding_3step:
    - "Welcome to /observe! Here is how it works:"
    - "Go to the classroom and record the lesson"     # 1️⃣ (audio)
    - "I will send you a pre-filled FICO form"          # 2️⃣ review and edit
    - "a guided debrief with the teacher"               # 3️⃣ + summary
  visit_entry: "Let's plan your visit. Pick a school, then a teacher — I'll brief you before you walk in."
  visit_entry_cta: "Plan my visit"
  scheduling_menu_rows:
    - "Complete debriefs"          # secondary: "No pending debriefs" | "<n> pending"
    - "My schedule"                # secondary: "<n> upcoming" | "Nothing scheduled yet"
    - "Schedule new observation"   # secondary: "Pick a school and teacher"
  support_brief_no_data: "No coaching data for this teacher yet — use this visit to spot it."
  support_brief_footer: "This is guidance to support your visit — not a grade or a ranking."
  schedule_slots: ["07:30","08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30"]  # weekends disabled in the date picker
  schedule_ack: "Observation scheduled for {teacher} on {date} at {time}. Tap /observe anytime to see your schedule."
  long_audio_no_state: "I received a long recording — but there's no observation waiting for you right now. If this was a lesson or debrief recording, type /observe first (and pick the right observation), then send it again."
