  #   method: baileys

# ─────────────────────────────────────────────────────────────────────────────
# PERSONA / ROLE MODEL  (added 2026-08-04)
#
# NIETE features are role-gated on `users.role` (source of truth: the LEADER_ROLES
# allowlist in NIETE-Rumi bot/shared/services/observe/observe-gate.js). Rather than
# maintain one phone per role, we use ONE throwaway `test_driver` per profile and
# FLIP its `users.role` at run start to match the scenario's @persona tag.
#
# Scenario persona is resolved as:  scenario-level @persona:<role>  >  feature-level
# @persona:<role>  >  default `teacher`. The runner SETS the role (idempotent UPDATE),
# READS IT BACK to confirm, then drives. A read-back mismatch → BLOCKED (never a false PASS).
personas:
  teacher:   { role_value: "teacher",       unlocks: "menu · training · lesson-plan · coaching · registration · status · attendance (student-marking)" }
  leader:    { role_value: "school_leader", unlocks: "/observe (any LEADER_ROLE works: school_leader|supervisor|coach|principal|aeo)" }
  coach:     { role_value: "coach",         unlocks: "/observe (LEADER_ROLE) — matches observe.feature @persona:coach" }
  principal: { role_value: "principal",     unlocks: "attendance (teacher-marking channel) AND /observe (principal ∈ LEADER_ROLES)" }

# The role flip is a DB write → prefer STAGING (Rule 7: prod-DB writes need a per-action go).
role_switch:
  enabled: false                      # flip to true once test_driver + creds + seed are in place
  db: "NIETE Supabase — per env"      # staging: keys/niete-staging.env · prod: keys/niete-prod.env or ./.env (SUPABASE_* / service_role), repo-root relative — NEVER inline here
  table: "users"
  key_column: "phone_number"          # match the test_driver (normalize to E.164, digits only)
  role_column: "role"                 # VARCHAR(32); values per `personas.*.role_value` above
  set_recipe: "UPDATE users SET role = :role_value WHERE phone_number = :test_driver;"
  read_back: "SELECT role FROM users WHERE phone_number = :test_driver;"   # must equal role_value or BLOCK
  # 'never downgrade an existing leader' (flow-response.handler.js:770): a teacher run MUST set
  # role='teacher' explicitly — do not rely on re-registration to reset it.

  # ONE-TIME SEED (data the gate flag does NOT provide; do once, then only the role flips):
  seed:
    leader/coach: "users.school_id set (FK → schools) + teachers on that school's roster, so the /observe visit-picker (school→teacher) has data. Optional: users.preferences.observe_onboarding_arm='functional'."
    principal:    "users.school_id set + teachers in that school, so the principal teacher-marking channel has teachers to mark."
    config_gates: "runtime env must have OBSERVE_MEWAKA_FLOW_ID (observe) — CONFIRMED SET on niete-prod 2026-08-04; attendance Flows: ATTENDANCE_MARKING_FLOW_ID / ATTENDANCE_SETUP_FLOW_ID / EDIT_CLASS_FLOW_ID (else text fallback)."

# ─────────────────────────────────────────────────────────────────────────────
# LESSON-PLAN SEED OPTION  (added 2026-08-06)
#
# Makes the currently-non-Chrome-MCP-runnable lesson-plan scenarios drivable live.
# The plain safe run drives 8 scenarios with NO seed; the rows below unlock the rest.
# Each recipe says: what to set · where · whether it's covered by the test_driver
# standing_authorization (reversible, runs on the resolved driver) or STILL GATED (needs an
# explicit per-action go — shared-catalog writes, env-var/deploy changes, Rule 7).
# The @seeded tag on a scenario in lesson-plan.feature = "runnable via Chrome MCP once
# the matching recipe here is applied". DB: NIETE Supabase, resolved PER ENV by
# `niete_training_db.py --env` (staging -> keys/niete-staging.env, prod -> keys/niete-prod.env or ./.env, repo-root relative;
# service_role) — NEVER inline here. Prefer STAGING for any shared write.
lp_seed:
  enabled: false                       # flip true per-run once the target row's recipe is applied + read back
  # ── No seed needed — just pick a qualifying value live (READ-ONLY discovery) ──
  discovery_only:
    empty_grade:   "pick a grade with ZERO rows in pre_generated_lps(curriculum='pakistan'); confirm via SELECT before driving (do NOT delete a real grade's corpus)."
    empty_subject: "pick a grade+subject with no rows; same SELECT-first discovery."
    oxbridge_flow: "grades 6–10 already carry lesson_plan_catalog(source='oxbridge') rows (see tests/pregen/feat-059-080). Verify one exists, then drive that grade."
    oxbridge_nl_picker: "phrase the NL request to match an existing oxbridge catalog topic (grade 6–12) so the 2-button picker fires."
  # ── Test-driver-scoped, REVERSIBLE → within standing_authorization (runs on the resolved driver) ──
  test_driver_scoped:
    first_use_reset: "clear the LP first-use marker for the test_driver so the 'Show me!/Just tell me' consent fires again — confirm the exact column/flag in feature-keyword-detector.service.js before writing; reversible."
    language_toggle: "for the @i18n case set preferred_language='ur' (auto_op language-toggle), drive, then restore 'en'."
  # ── STILL GATED — shared-catalog write / env change → explicit per-action go, prefer staging ──
  gated:
    r2_missing:   "insert (or point) ONE pre_generated_lps / lesson_plan_catalog row at a non-existent R2 key, drive the 'not available right now' path, then DELETE the row. Shared table → explicit go; reversible."
    curriculum:   "region_features.curriculum_lp_enabled=true + one curriculum_lp_ast row with a known topic (cache-hit) and one without a cached PDF (cache-miss/2-min-ack). Region/shared → explicit go."
    pic_to_lp:    "set env PIC_LP_FLOW_ID (+ the published Pic-LP Flow) — an ENV/DEPLOY change, not a DB seed. Staging only."
  # The config-gated fallback (PAKISTAN_LP_FLOW_ID unset) and a forced generation failure are NOT in
  # lesson-plan.feature — the first needs a non-prod env, the second a forced Gamma throw → both live in
  # the jest/mock layer (tests/ in this repo), not Chrome-MCP.
