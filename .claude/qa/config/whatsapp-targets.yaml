# WhatsApp E2E targets — resolved by each per-feature agent (agents/niete-<feature>-agent.md)
# from the feature's @profile:<tenant> tag. NEVER hardcode a number in a .feature; put it here.
# `method` picks the driver: chrome (desktop, drives native Flows) or baileys
# (headless/EC2, read-assertions + dispatch only — can't drive native Flows).
#
# `number` is the BOT under test (what the agent messages), digits only, no +.
# `test_driver` is the account whose linked WhatsApp Web session drives the bot. It is
#   `prompt` — resolved AT RUNTIME from whoever is running the suite: ask the runner for
#   THEIR OWN linked WhatsApp number (digits, no +). NEVER hardcode one person's number here
#   (it used to be pinned to the operator's 923028931858 — bd-2748). The resolved number
#   drives EVERY in-scope scenario; the number itself NEVER restricts which tests run
#   (operator, bd-2748). `all` mode mutates the driver account's real state, so runners
#   should use a test/throwaway number they're fine resetting — that's advice, not a gate.

default_profile: niete

profiles:
  # DEFAULT E2E TARGET = STAGING (923222482222 / "Rumi Staging Niete").
  # Re-verified live 2026-08-07: staging code is now CURRENT — menu (Teacher Training present,
  # no Reading Assessment), /training native Flow, and the templated /certificate handler all
  # MATCH prod. The 2026-08-05 "older code" drift (AI cert fallback, 62-vs-20 exam caption,
  # "Managed by Rumi niete." footer) is RESOLVED. So the read / copy / entry / negative
  # scenarios are faithful here — run the whole suite on staging by default.
  # ✅ SEPARATE DB (corrected 2026-08-16 — the earlier "SHARED DB" claim was WRONG):
  #   staging has its OWN Supabase, project ref `rpqkekcfvumypldbejhp` (NOT prod's `ihzciabopbttygxxgrkm`).
  #   PROVEN: the same driver 923028931858 returns role=coach on staging vs role=teacher on prod — it
  #   cannot be one DB. The near-identical training progress seen 2026-08-05 was a point-in-time SEED
  #   copy, not a live shared DB. So seed/revert/destructive writes on staging do NOT touch prod data.
  #   Still drive stateful writes only via the throwaway driver + revert (cleanliness, not isolation).
  #   Staging logs to Axiom `digital-coach-logs` under `env=staging` (service=bot). DB creds: a staging
  #   service_role key (rotate if leaked) — NEVER inline here. It lives in `keys/niete-staging.env` at THIS repo's root
  #   (gitignored, project credential home per root CLAUDE.md); re-fetch with
  #   `railway link -p 'NIETE-Rumi Staging' && railway variables --service bot`.
  #   ⚠️ bd-2759: `niete_training_db.py` used to read the repo's prod `.env` unconditionally, i.e. PROD, so
  #   seeding during a staging run wrote to the WRONG DB and did nothing to the bot under test. It now
  #   resolves creds per `--env` (default = the env of `default_profile` below) and ABORTS if the
  #   resolved Supabase project ref does not match the env.
  niete:
    tenant: NIETE (ICT / Islamabad)
    env: staging
    number: "923222482222"
    method: chrome        # native Training Flow needs the desktop Chrome-MCP route
    test_driver: prompt   # RUNTIME: ask the runner for THEIR OWN linked WhatsApp number (digits, no +). Not hardcoded (bd-2748). Drives every in-scope scenario; the number never restricts the run.
    notes: "staging — DEFAULT e2e target; code verified current 2026-08-07; OWN DB rpqkekcfvumypldbejhp (isolated from prod); logs to Axiom env=staging"

  # LOCAL MOCK LANE — the bot runs on THIS machine from a detached worktree at one commit, against
  # the SANDBOX Supabase (keys/niete-sandbox.env, project olvritwoqujtjvwfulbh — never staging or
  # prod), with WHATSAPP_API_BASE pointed at bot/scripts/e2e/mock-graph-api.js. `method: mock` makes
  # run-suite.sh skip every Chrome/CDP precondition and feature-runner.cjs load mock-api.cjs, which
  # exposes the same primitives as the CDP api, so menu/language/status/lesson-plan/coaching/training run
  # unchanged (media rides the mock; a private redis + the queue worker run the pipelines). Flows are
  # NOT rendered here — every Flow scenario records BLOCKED/SKIP through its own branch, never PASS.
  # Vendors are cassette replay-strict: a miss fails the run loudly instead of going live.
  # `number` is a placeholder (there is no WhatsApp number); the driver is a fixed synthetic
  # phone that exists only in the sandbox DB. Select with:  run-suite.sh <features> --method mock
  niete-local:
    tenant: NIETE (ICT / Islamabad) — LOCAL MOCK
    env: sandbox
    number: "local"
    method: mock
    test_driver: "923000000001"
    notes: "commit-time lane; bot from a pinned commit; sandbox DB; mock Graph API + media; private redis + queue worker; cassette replay-strict (staging R2 mirror); no Flow rendering"

  # PROD — explicit target only; stateful scenarios mutate real training progress.
  niete-prod:
    tenant: NIETE (ICT / Islamabad) — PRODUCTION
    env: prod
    number: "923206281951"
    waba_id: "1551576156552661"
    method: chrome
    test_driver: prompt   # RUNTIME: ask the runner for THEIR OWN linked WhatsApp number (digits, no +). Not hardcoded (bd-2748). Drives every in-scope scenario; the number never restricts the run.
    notes: "prod — run only with explicit go; mutates real state. Drive from a test/throwaway number you're fine resetting, never a real teacher's account."
    # STANDING AUTHORIZATION (operator, 2026-08-06): the reversible training DB seeds are
    # PRE-APPROVED on the run's resolved driver (the runner's own linked number) — the agent
    # runs them automatically, no per-action prompt. Operator: "next time I don't want to say
    # the seed thing." Scope:
    #   • ALLOWED without asking: niete_training_db.py seed-level-complete / revert-level /
    #     activate-program (is_active flip) / role flip / preferred_language toggle — i.e. the
    #     additive+reversible training-state writes on the run's resolved driver, via --yes-write.
    #   • STILL GATED (per-action go): any OTHER account (not the run's driver), prod-user data,
    #     outward sends, schema changes, or anything not reversible. This authorization is scoped
    #     to reversible training-state seeds on the driver being tested — nothing else.
    #   • Always print what was written + how to revert; leave the account reversible.
    standing_authorization:
      scope: "reversible training-state DB seeds on the run's resolved driver (the runner's own linked number)"
      auto_ops: ["seed-level-complete", "revert-level", "activate-program", "role-flip", "language-toggle"]
      still_gated: ["real/other accounts", "prod-user data", "outward sends", "schema changes", "irreversible writes"]
      granted: "2026-08-06 (operator: don't re-ask for the seed step)"

  # PALESTINE (RISE / British Council) — PROD, no staging surface (like NIETE).
  # Served by the MAIN Rumi bot, region-gated detectRegion()==='PS'. Number confirmed
  # live 2026-08-12 via WhatsApp contact info (business acct, rumi@hellorumi.ai, +970...).
  # Menu (exploratory 2026-08-12): Lesson Plans (native Flow, Grade→Subject→Unit→Lesson;
  # live sample = Grades 2 & 9 ONLY vs the G1–4 build) · Classroom Coaching · Scope &
  # Sequence · Help (User Guide PDF). Arabic input → English reply (English floor).
  # ⚠️ PROD teachers are real (RISE Ramallah) — run only with an explicit per-run go,
  # and drive from a THROWAWAY account, never a real teacher's / personal phone.
  rumi-palestine:
    tenant: Palestine (RISE / British Council) — PRODUCTION
    env: prod
    number: "970592185147"
    method: chrome        # native Lesson-Plan Flow needs the desktop Chrome-MCP route
    test_driver: "TBD"    # no throwaway provisioned yet; do NOT use a real teacher/personal account
    notes: "prod, no staging; main-bot region PS. Number confirmed 2026-08-12 (+970 592 185 147). Needs a dedicated throwaway driver before stateful runs."

  # Template for future tenants (uncomment + fill):
  # shams:
  #   tenant: Main Rumi (staging)
  #   env: staging
