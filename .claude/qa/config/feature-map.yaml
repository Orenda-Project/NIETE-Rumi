# feature-map.yaml — changed source file → affected NIETE E2E feature(s)
#
# Consumed by `.claude/qa/shared/select_e2e.py`, which the pre-push hook calls to
# print the TARGETED `/niete-e2e <feature>` commands for a push instead of leaving
# you to run the whole suite (bd-43512).
#
# ─────────────────────────────────────────────────────────────────────────────
# THE ONE THING TO UNDERSTAND: this map is HAND-MAINTAINED, and that is deliberate.
#
# The `.feature` specs already carry incidental code groundings in comments
# (`menu.service.js:265`), but their coverage is wildly uneven — language 22 refs,
# observe 21, versus status 2 and training 3. Inferring the map from them would
# under-select exactly where the suite is thinnest. So the map is explicit, and
# rot is caught at the moment it matters instead: a changed file that matches
# NOTHING here is reported as UNMAPPED and the SAFE subset is selected as a
# fallback. Under-selection is never silent.
#
# When you add a service/handler/route, add it here in the same pass.
# ─────────────────────────────────────────────────────────────────────────────
#
# GLOB SYNTAX (see select_e2e.glob_match):
#   *   any run of characters WITHIN one path segment (does not cross `/`)
#   **  any run of characters INCLUDING `/`
#   ?   exactly one non-`/` character
#   everything else is literal — a `.` is a dot, not a regex wildcard
#
# PATHS are relative to the repo root they were changed in:
#   · bot/**                            → the NIETE-Rumi repo
#   · tests/features/whatsapp/niete/**  → this repo (handled natively: a change to
#                                         `<name>.feature` selects `<name>`; no
#                                         entry below is needed for it)
#
# The feature KEYS must match the nine agents in `.claude/qa/agents/` exactly —
# the loader raises MapError on a key with no agent, so a renamed feature fails
# loudly here rather than quietly selecting nothing.

version: 1

# ── scope ────────────────────────────────────────────────────────────────────
# What this suite is allowed to have an opinion about AT ALL. A path outside scope
# is reported as out-of-scope and never triggers the unmapped fallback.
#
# This boundary is what makes the fallback worth having. NIETE-Rumi is a monorepo:
# of its 1,716 tracked files, 647 are the React teacher portal, the observability
# dashboard, infrastructure and migration scripts. Without `scope:` every one of
# them would land in UNMAPPED and drag the SAFE subset into a push that cannot
# change WhatsApp behaviour — and a fallback that fires on every push is one the
# operator learns to scroll past, which is the same as not having it.
scope:
  - bot/**                              # the WhatsApp bot runtime (see ignore: for the inert parts)
  - tests/features/whatsapp/niete/**    # the specs, in THIS repo

# ── full-suite promotions ───────────────────────────────────────────────────
# Where a commit earns the WHOLE 99-scenario suite instead of a targeted run.
#
# Operator decision (2026-08-24): a commit to NIETE-Rumi `develop` arms only what
# its diff touched; the `develop` -> `main` PROMOTION arms `/niete-e2e all`. That
# is the one moment 3-5 hours of WhatsApp driving is worth spending — `all` runs
# 99 scenarios, coaching's 15 alone take ~2.5h on real audio, and it deliberately
# includes @destructive/@slow (blanks the driver's registration name, mutates quiz
# progress, flips users.role and preferred_language). Firing that on every develop
# commit would burn hours per merge and trash the driver account daily.
#
# MERGE COMMITS ARM HERE, AND ONLY HERE. Everywhere else a merge is skipped — it
# introduces no work of its own, so arming would re-run features already armed
# when their real commits landed. But a merge INTO main IS the promotion; skipping
# it would mean the full suite never fires at all, since that is exactly the shape
# the promotion takes.
#
# `repo_match` is tested against the origin remote URL, not the directory name, so
# a clone in a differently-named folder still matches.
full_suite_on:
  - repo_match: NIETE-Rumi
    branches: [main]
    command: /niete-e2e all

