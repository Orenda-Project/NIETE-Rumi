# ── inert ────────────────────────────────────────────────────────────────────
# These select nothing AND do not trigger the unmapped fallback — they are the
# "docs/config-only change" case.
#
# PRECEDENCE: spec path → `features:`/`shared:` → `ignore:` → unmapped, and a path
# outside `scope:` short-circuits the lot. An explicit mapping therefore always
# wins over `ignore:` — which is why `bot/docs/**` can sit in this list while
# `bot/docs/flows/registration-flow.json` still selects registration: a published
# Flow JSON is teacher-facing, the prose around it is not.
#
# Only paths INSIDE scope need listing here; `portal/**`, `dashboard/**`,
# `infrastructure/**` and the root `scripts/**` are already out of scope.
#
# Keep this list SHORT and boring. Anything genuinely ambiguous (`bot/railway.json`,
# `bot/package.json`, a DB migration, an asset the bot serves) is deliberately
# ABSENT, so it lands in UNMAPPED and pulls the SAFE subset. One extra safe run
# beats waving a behaviour change through.
ignore:
  - bot/tests/**
  - bot/node_modules       # the committed dep-set symlink / lockfile-pinned tree — never source
  - bot/node_modules/**    # installed dependencies, never source
  # E2E-harness seams — inert in production, never change what a teacher sees:
  #   e2e-cassette.js records/replays vendor calls only when E2E_CASSETTE is set (off by default);
  #   build-info.js only feeds the running commit sha onto /health for the mock lane's sha check.
  - bot/shared/services/e2e-cassette.js
  - bot/shared/utils/build-info.js
  - bot/scripts/**         # one-off ops tools. A Flow republish DOES change what
                           # teachers see, but running it is a manual act, not an
                           # effect of a push — so a push that only edits one
                           # warrants no E2E.
  - bot/dashboard/**       # the bot repo's legacy admin views, not the WA runtime
  - bot/docs/**            # except bot/docs/flows/*.json, re-claimed in features:
  - bot/.github/**
  - bot/fonts/**
  - bot/shared/fonts/**
  - bot/assets/**
  - bot/shared/assets/**
  - bot/marketing/**
  - bot/logs/**
  - bot/temp/**
  - bot/test-assets/**
  - bot/VERSION
  - bot/.deploy-marker
  - bot/jest.config.js
  - "**/__mocks__/**"
  - "**/*.test.js"
  - "**/*.spec.js"
  - "**/*.md"
  - "**/*.txt"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.svg"
  - "**/*.pdf"
  - "**/*.ttf"
  - "**/*.snap"
  - "**/package-lock.json"
  - "**/.gitignore"
  - "**/.env.example"
  - "**/.env.template"

# ── scenarios ────────────────────────────────────────────────────────────────
# OPTIONAL scenario pins, read by select_scenarios.py: a changed path → exactly these scenario ids of a
# feature. Without a pin, a path selects the scenarios whose text NAMES it (the specs already ground their
# scenarios in code, e.g. "coaching-inflight-guard.js shouldDeferNewClassroomAudio"); a path no scenario
# names makes its feature run WHOLE. Pin such a path here to narrow it. Ids must be live @e2e scenarios.
#
# scenarios:
#   coaching:
#     bot/shared/services/coaching/session-terminal.js: [COA24]
#   training:
#     bot/shared/services/quiz/transcript-quiz-nudge.service.js: [T61, T52]


scenarios:
  lesson-plan:
    # The bare-keyword matcher: decides whether a whole message opens the Lesson Plans Flow (L02, L08)
    # or goes on to the LLM (L04). No lesson-plan scenario names the file, so without this pin every
    # edit to it ran all eleven.
    bot/shared/utils/lp-intent.js: [L02, L08, L04]

# ── web lane (bd-hnhlgn.6 / .8) ─────────────────────────────────────────────
# The teacher + coach PORTAL, driven in a headless browser on a local stack started at the commit itself:
# `npm run e2e:web -- <feature>` (scripts/qa/e2e-web.sh). Separate from everything above on purpose — the WhatsApp
# `scope:` keeps portal/** out so a portal edit never drags in the WhatsApp SAFE subset; this block is where those
# paths ARE claimed. Each feature key must have a driver at .claude/qa/web/features/<key>.cjs (load_map raises
# otherwise), and a change to tests/features/web/<key>.feature selects <key> on its own, no entry needed.
#
# scope + fallback: NO portal change is silent. A path inside `scope:` that no feature claims selects `fallback:`
# (portal-smoke — every main page, every role), the web lane's SAFE subset. Shared plumbing that sits under every page
# (App.tsx, the API client, the UI kit, auth hooks) is mapped to portal-smoke on purpose.
# Same discipline as above: add a path here in the same pass as the code it guards.
web:
  scope:
    - portal/src/**
    - portal/index.html
    - portal/vite.config.ts
    - portal/package.json
    - dashboard/routes/**
    - dashboard/lib/**
    - dashboard/services/**
