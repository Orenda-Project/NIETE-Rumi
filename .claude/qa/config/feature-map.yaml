# ── shared / fan-out ─────────────────────────────────────────────────────────
# One file, several surfaces. Declared HERE rather than repeated under each
# feature so the fan-out is visible as data — and so the selector can label the
# match as "shared" in its output, which is the difference between an operator
# understanding why six commands appeared and assuming the tool is broken.
#
# `"*"` means every feature in `features:` above.
shared:
  # The process entrypoint and the send layer — everything goes through these.
  bot/whatsapp-bot.js: "*"
  # Meta's X-Hub-Signature-256 check in front of /webhook and /api/flows: every inbound message passes it.
  bot/shared/services/webhook-signature.js: "*"
  bot/shared/services/whatsapp.service.js: "*"
  bot/shared/services/region-features.service.js: "*"
  bot/shared/config/region-config.js: "*"
  # Every LLM job's model id (lesson plans, coaching, quiz, child-test scoring, …).
  bot/shared/config/model-registry.js: "*"
  # bd-gr4fy.8 map gaps, attributed by the real require graph (audit_feature_map.py, 6 Oct 2026).
  bot/shared/config/lp612-flags.js: [child-test, coaching, lesson-plan, menu, observe, status, training]
  bot/shared/services/lp-vision-ocr.service.js: [child-test, coaching, lesson-plan, menu, observe, training]
  bot/shared/services/voice-attendance.service.js: [attendance, child-test, coaching, lesson-plan, menu, training]
  # Opt-in sandbox echo of outbound WhatsApp payloads (WA_OUTBOUND_ECHO_TO); called from whatsapp.service.js.
  bot/shared/services/outbound-echo.js: "*"
  bot/shared/utils/region.js: "*"

  # The command/text router: 6 surfaces assert copy that originates here.
  bot/shared/handlers/text-message.handler.js:
    [registration, menu, training, lesson-plan, coaching, language, status, observe, attendance, child-test]

  # Voice intake — coaching audio, LP-by-voice, voice attendance, language detect.
  bot/shared/handlers/voice-message.handler.js:
    [registration, menu, training, lesson-plan, coaching, language, status, observe, attendance, child-test]

  # bd-onxyu — the app-redirect switches. Every feature door asks it first, so a change here can
  # silence any of these surfaces (each switch is off by default; off = no behaviour change).
  bot/shared/services/app-redirect.service.js:
    [menu, training, lesson-plan, coaching, observe, attendance]

  # Native Flow submissions land here before dispatch to a surface.
  bot/shared/handlers/flow-response.handler.js:
    [registration, menu, training, lesson-plan, coaching, language, status, observe, attendance, child-test]
  bot/shared/services/flow-encryption.service.js:
    [registration, training, lesson-plan, status, observe, attendance, child-test]
  bot/shared/routes/flow-endpoint.routes.js:
    [registration, menu, training, lesson-plan, coaching, language, status, observe, attendance, child-test]
  bot/shared/utils/flow-type-detector.js:
    [registration, training, lesson-plan, status, observe, attendance, child-test]

  # Shared persistence + context read by every stateful surface.
  bot/shared/database/**: "*"
  bot/shared/config/supabase.js: "*"
  bot/shared/services/cache/railway-redis.service.js: "*"
  bot/shared/services/context.service.js: [menu, coaching, lesson-plan, language]
  bot/shared/services/content.service.js: [menu, training, lesson-plan]
  bot/shared/services/openai.service.js: [menu, coaching, lesson-plan, language]
  bot/shared/services/llm-client.js: [menu, coaching, lesson-plan, language, child-test]
  bot/shared/services/gpt5-mini.service.js: [menu, coaching, lesson-plan, language]
  bot/shared/middleware/auth.js: "*"
  bot/shared/config/branding.js: "*"      # header/footer copy on every surface
  bot/shared/storage/r2.js: [training, lesson-plan, coaching, observe, child-test]
  bot/shared/services/queue/**: [training, lesson-plan, coaching, observe]
  bot/workers/sqs-worker.js:
    [registration, menu, training, lesson-plan, coaching, language, status, observe]


  # Reaches the LP / training / language internals it proxies for the portal.
  bot/shared/routes/internal-api.routes.js:
    [language, lesson-plan, training]


