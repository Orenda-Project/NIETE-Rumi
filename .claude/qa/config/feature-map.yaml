# ── not covered ──────────────────────────────────────────────────────────────
# In scope, real bot code, deliberately NO E2E — each with the reason, because a
# surface with no coverage should say so out loud.
#
# This is the third honest answer, and it exists so the other two stay meaningful.
# Reading Assessment and video generation are live code with no `.feature` file:
# ICT's menu carries exactly four rows (Teacher Training, Lesson Plans, Classroom
# Coaching, Ask Anything) and none of them is reading or video. Putting these in
# `ignore:` would be a lie (they are not inert); leaving them unmapped would pull
# the SAFE subset on every touch forever, which is noise. So they get named.
#
# An explicit `features:`/`shared:` mapping still wins — `quiz/video-quiz-*` is
# training-mapped and is not swallowed by the video rule below.
#
# TO REMOVE AN ENTRY: write the `.feature` file + agent, add it to `features:`,
# delete the line here. That is the whole promotion path.
