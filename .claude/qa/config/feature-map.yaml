# ── inert ────────────────────────────────────────────────────────────────────
# These select nothing AND do not trigger the unmapped fallback — they are the
# "docs/config-only change" case.
#
# PRECEDENCE: spec path → `features:`/`shared:` → `ignore:` → unmapped, and a path
# outside `scope:` short-circuits the lot. An explicit mapping therefore always
# wins over `ignore:` — which is why `bot/docs/**` can sit in this list while
# `bot/docs/flows/registration-flow.json` still selects registration: a published
# Flow JSON is teacher-facing, the prose around it is not.
#
# Only paths INSIDE scope need listing here; `portal/**`, `dashboard/**`,
# `infrastructure/**` and the root `scripts/**` are already out of scope.
#
# Keep this list SHORT and boring. Anything genuinely ambiguous (`bot/railway.json`,
# `bot/package.json`, a DB migration, an asset the bot serves) is deliberately
# ABSENT, so it lands in UNMAPPED and pulls the SAFE subset. One extra safe run
# beats waving a behaviour change through.
ignore:
  - bot/tests/**
  - bot/node_modules       # the committed dep-set symlink / lockfile-pinned tree — never source
  - bot/node_modules/**    # installed dependencies, never source
  # E2E-harness seams — inert in production, never change what a teacher sees:
  #   e2e-cassette.js records/replays vendor calls only when E2E_CASSETTE is set (off by default);
  #   build-info.js only feeds the running commit sha onto /health for the mock lane's sha check.
  - bot/shared/services/e2e-cassette.js
  - bot/shared/utils/build-info.js
  - bot/scripts/**         # one-off ops tools. A Flow republish DOES change what
                           # teachers see, but running it is a manual act, not an
                           # effect of a push — so a push that only edits one
                           # warrants no E2E.
  - bot/dashboard/**       # the bot repo's legacy admin views, not the WA runtime
  - bot/docs/**            # except bot/docs/flows/*.json, re-claimed in features:
  - bot/.github/**
  - bot/fonts/**
  - bot/shared/fonts/**
  - bot/assets/**
  - bot/shared/assets/**
  - bot/marketing/**
  - bot/logs/**
  - bot/temp/**
  - bot/test-assets/**
  - bot/VERSION
  - bot/.deploy-marker
