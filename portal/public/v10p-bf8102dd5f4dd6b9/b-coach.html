<!doctype html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ایک ٹیچر دورہ چاہتی ہیں</title><style>
:root{--ink:#1d2433;--soft:#5b6578;--ok:#2B8A3E;--blue:#3B5BDB;--wa:#e5ddd5;--out:#dcf8c6}
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",
"Noto Nastaliq Urdu","Noto Naskh Arabic",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0 0 10px}h2{font-size:17px;margin:0 0 8px}
.box{background:#fff;border-radius:14px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 3px #0001}
label.r{display:flex;gap:10px;align-items:flex-start;padding:8px 0}label.r input{width:22px;height:22px;flex:none;margin-top:2px}
.btn{display:block;width:100%;font:inherit;font-weight:800;border:0;border-radius:12px;padding:13px;background:var(--blue);
color:#fff;text-align:center;text-decoration:none;cursor:pointer;margin:10px 0 0}
.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.hint{color:var(--soft);font-size:15px;margin:6px 0 0}
.ok{color:var(--ok);font-weight:800}ul{margin:0;padding:0 18px}audio{width:100%;margin:8px 0 0}
.wa{background:var(--wa);min-height:100vh}.bub{background:#fff;border-radius:10px;padding:10px 12px;margin:0 0 8px;max-width:86%}
.me{background:var(--out);margin-inline-start:auto}.qb{display:grid;gap:6px;margin:0 0 8px;max-width:86%}
.qb button{font:inherit;font-weight:700;color:#027eb5;background:#fff;border:0;border-radius:10px;padding:9px;cursor:pointer}
input.t{width:100%;font:inherit;padding:10px;border-radius:20px;border:1px solid #ccc}
</style></head><body><main>
<h1>ایک ٹیچر دورہ چاہتی ہیں</h1><section class="box"><h2>Teacher B</h2><p>G3 Urdu ch3 L2 · 7 Oct</p></section>
<section class="box"><h2>ٹیچر کے مطابق کیا ٹھیک نہیں تھا</h2><ul id="rs" data-voice-only="وائس نوٹ"><li>وائس نوٹ</li></ul></section>
<section class="box"><h2>ٹیچر کا وائس نوٹ</h2><audio id="pl" controls hidden></audio><p class="hint" id="none">کوئی وائس نوٹ نہیں</p></section>
<button class="btn" type="button" id="v">میں نے دورہ کر لیا</button><p class="ok" id="vd" hidden>✓ دورہ ہو گیا۔ شکریہ۔</p>
<script type="application/json" id="w">{"score": "میرا اسکور درست نہیں لگتا", "missed": "میں نے یہ کیا تھا، رپورٹ نے نہیں پکڑا", "wont_work": "یہ کام میری کلاس میں ممکن نہیں", "unclear": "سمجھ نہیں آیا کہ کرنا کیا ہے"}</script>
</main><script>(function(){var W=JSON.parse(document.getElementById('w').textContent),q=(location.search.match(/[?&]r=([^&]*)/)||[])[1]||'',
c=decodeURIComponent(q).split(',').filter(function(x){return W[x]}),ul=document.getElementById('rs');
ul.innerHTML='';(c.length?c.map(function(x){return W[x]}):[ul.dataset.voiceOnly]).forEach(function(t){var li=document.createElement('li');
li.textContent=t;ul.appendChild(li)});try{var n=sessionStorage.getItem('v10p-note');if(n){var a=document.getElementById('pl');a.src=n;
a.hidden=false;document.getElementById('none').hidden=true}}catch(e){}
document.getElementById('v').onclick=function(){this.hidden=true;document.getElementById('vd').hidden=false}})();</script></body></html>
