apply plugin: 'com.android.application'

// Release signing, sourced from the environment or gradle.properties — NEVER committed.
//
// Play App Signing is enabled for this listing, so this is the UPLOAD key: we sign
// with it, Google verifies, strips our signature, and re-signs with the app-signing
// key it holds. Anything that pins a certificate (Google Sign-In, App Links
// assetlinks.json) must use the APP-SIGNING fingerprint, not this one.
//
// Set NIETE_KEYSTORE_PATH / NIETE_KEYSTORE_PASSWORD / NIETE_KEY_ALIAS /
// NIETE_KEY_PASSWORD, or the matching keys in a gitignored keystore.properties.
// See keystore.properties.template.
def nieteKeystore = System.getenv('NIETE_KEYSTORE_PATH') ?: findProperty('NIETE_KEYSTORE_PATH')
def nieteStorePass = System.getenv('NIETE_KEYSTORE_PASSWORD') ?: findProperty('NIETE_KEYSTORE_PASSWORD')
def nieteAlias = System.getenv('NIETE_KEY_ALIAS') ?: findProperty('NIETE_KEY_ALIAS')
def nieteKeyPass = System.getenv('NIETE_KEY_PASSWORD') ?: findProperty('NIETE_KEY_PASSWORD')
def hasNieteSigning = nieteKeystore && nieteStorePass && nieteAlias && nieteKeyPass

android {
    namespace = "pk.edu.niete"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pk.edu.niete"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1205
        versionName "1205"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Default launcher label; the debug build type overrides it.
        manifestPlaceholders = [appLabel: "NIETE"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasNieteSigning) {
            release {
                storeFile file(nieteKeystore)
                storePassword nieteStorePass
                keyAlias nieteAlias
                keyPassword nieteKeyPass
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds install as `pk.edu.niete.debug` so they sit alongside
            // the production NIETE app instead of colliding with it. Without this,
            // installing a debug build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE
            // (different signing key), and the only way through is uninstalling
            // the real app.
            //
            // Release builds are UNAFFECTED — they keep `pk.edu.niete`, which is
            // required to update the existing Play listing.
            applicationIdSuffix ".debug"
            // Distinct launcher label so the two apps are told apart on the
            // home screen. Uses manifestPlaceholders rather than resValue
            // because app_name already exists in res/values/strings.xml and
            // redefining it there is a duplicate-resource build failure.
            manifestPlaceholders = [appLabel: "NIETE Debug"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // NO applicationIdSuffix here — release MUST stay exactly `pk.edu.niete`,
            // the package Play uses to identify the existing listing.
            if (hasNieteSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// bd-2396: name the release artifact after the version.
//
// Gradle's default output is `app-release.aab` for every build, so two AABs
// from different versions are indistinguishable the moment they leave the build
// directory — and the file that matters is the one being uploaded to Play.
//
// The name is derived from versionCode, never hardcoded, so it cannot go stale
// across a bump: versionCode 1203 produces `niete-rumi-v1203.aab`.
//
// `archivesName` (not the Gradle-9-removed `archivesBaseName`) sets the base;
// the bundle task then appends its build type, so Gradle's own output is
// `niete-rumi-v<code>-release.aab`. The rename below drops that `-release`
// tail to land the exact name.
//
// bd-2520: the rename MOVES rather than copies, so exactly ONE .aab survives.
// It used to copy, leaving Gradle's `-release` name beside the versioned one —
// two byte-identical files for a single artifact (verified at 1204: both
// 6255617 bytes, same md5). Nothing in CI or any script looks for the
// `-release` name, and keeping it was a foot-gun: `-release` denotes the build
// TYPE, but reads as "the real one", so it invites uploading the wrong file.
base {
    archivesName = "niete-rumi-v${android.defaultConfig.versionCode}"
}

tasks.whenTaskAdded { task ->
    if (task.name == 'bundleRelease') {
        task.doLast {
            def outDir = file("${layout.buildDirectory.get()}/outputs/bundle/release")
            def versioned = new File(outDir, "niete-rumi-v${android.defaultConfig.versionCode}.aab")
            outDir.listFiles()?.findAll { it.name.endsWith('.aab') && it.name != versioned.name }?.each {
                java.nio.file.Files.move(
                    it.toPath(), versioned.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
            if (versioned.exists()) {
                logger.lifecycle("Release bundle: ${versioned}")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
