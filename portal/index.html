<!doctype html>

    <!-- bd-sex15q.34 — a coach's or an RM's first open: the session and the flags are asked for now, not after the
         app's first chunk has arrived (seconds on a slow line). The app takes each answer once (src/lib/bootReads.ts);
         an answer that is not OK is handed over as null and the app reads as before. Never a /coachip/ request here:
         the app reads the switch first. Not in the Android app (its API is on another origin). First in <head>: an inline script after a stylesheet
         waits for that stylesheet, which on a slow line is seconds. -->
    <!-- bd-1q4z4o — and the teacher Home (/portal/teacher, where WhatsApp's "open the app" link lands): /me/home too
         (the card, the Coach strip, the Quizzes tile), so the Home can draw its final layout at once instead of
         moving when they arrive. Each OK answer is also kept in `done` as it lands (src/lib/bootReads.ts peekBoot). -->
    <script id="coachip-boot">
      (function () {
        try {
          var p = location.pathname;
          var home = /^\/portal\/teacher\/?$/.test(p);
          if (!home && !/^\/portal\/(coach\/insights|rm)(\/|$)/.test(p)) return;
          var cap = window.Capacitor;
          if (cap && cap.isNativePlatform && cap.isNativePlatform()) return;
          var done = {};
          var read = function (k, u) {
            var r = fetch(u, { credentials: "include", headers: { Accept: "application/json" } })
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; });
            r.then(function (v) { if (v) done[k] = v; });
            return r;
          };
          var boot = { config: read("config", "/api/portal/config"), me: read("me", "/api/portal/me"), done: done };
          if (home) {
            boot.home = read("home", "/api/portal/me/home");
            // bd-43f1sk — her stored language too, so the app draws the Home once, in her language.
            boot.language = read("language", "/api/portal/me/language");
          }
          window.__nieteBoot = boot;
        } catch (e) { /* the app reads as before */ }
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans + Poppins per NIETE brand guide. Urdu's Nastaliq is NOT requested here:
         src/index.css's own @font-face "NIETE Nastaliq" (one woff2, Arabic-script only) draws it, and Google answered

         bd-fxk3t8: preloaded and switched on when they arrive, so they never hold up the first
         paint (the page shows in the fallback font for a moment instead of staying white). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- bd-fxk3t8: the static app shell. #root below holds an outline of the app (menu bar,
         tab bar, placeholder blocks) so the first paint is the app's frame, not a white page.
         React replaces it on its first render. Inline only — this file is also the Capacitor
         app's entry. Which outline: a sign-in page gets the sign-in card; otherwise the frame
         the app last showed on this device (niete:shell, written by the app — see
         src/portal/lib/shellHint.ts), else the classic one. "/" (every Android app launch) is the
         app's frame on a device that was signed in last time, the sign-in card otherwise. -->
    <script>
      (function () {
        var d = document.documentElement;
        var p = location.pathname;
        try {
          var k = window.localStorage.getItem('niete:shell');
          var known = k === 'teacher' || k === 'classic';
          if (p.indexOf('/portal/login') === 0 || p.indexOf('/portal/setup') === 0 ||
              p.indexOf('/portal/reset-password') === 0 || p.indexOf('/portal/delete-account') === 0 ||
              p.indexOf('/portal/privacy') === 0 || (p === '/' && !known)) {
            d.setAttribute('data-shell', 'login');
          } else if (/^\/portal\/teacher\/?$/.test(p) && k !== 'classic') {
            // bd-1q4z4o — the teacher Home (WhatsApp's link lands here, often with no memory at all): the Home look's
            // own outline. Kept in step with frameFor() in src/portal/lib/shellHint.ts.
            d.setAttribute('data-shell', 'teacher-look');
          } else if (known) {
            d.setAttribute('data-shell', k);
          }
        } catch (e) { /* storage blocked: the classic outline */ }
      })();
    </script>

      .as-look { display: none; }
      [data-shell="teacher-look"] .as-main { display: none; }
      [data-shell="teacher-look"] .as-look { display: block; }
      [data-shell="teacher-look"] .as-top { background: #fff; border-bottom: 1px solid #e5e7eb; }
      [data-shell="teacher-look"] .as-top .as-sk { background: #e5e7eb; }
      [data-shell="teacher-look"] .as-tab { height: 71px; }
      .as-lkband { height: 231px; background: #333748; padding: 18px 20px 0; box-sizing: border-box; }
      .as-lkband .as-sk { background: rgba(255, 255, 255, .18); }
      .as-lkmark { width: 44px; height: 44px; border-radius: 12px; }
      .as-lkt { width: 62%; height: 30px; margin-top: 18px; }
      .as-lkl { width: 44%; height: 14px; margin-top: 14px; }
      .as-lkgrid { position: relative; max-width: 576px; margin: -28px auto 0; padding: 0 16px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .as-lktile { height: 114px; background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
      .as-lkdot { width: 44px; height: 44px; border-radius: 12px; }
      .as-lkcl { width: 60%; height: 10px; }
      @media (min-width: 576px) {

      .as-lband { background: #333748; height: 204px; padding: 24px 20px 0; box-sizing: border-box; }

      @media (prefers-reduced-motion: no-preference) {

        @keyframes as-shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
