# Does `main` carry anything that never passed through `staging`?
#
# `main-source-branch.yml` refuses a PR into `main` that carries commits `staging` lacks, but it
# runs BEFORE the merge, on the pull request — so it is advisory the moment anyone with admin
# rights toggles branch protection off, merges, and turns it back on. `enforce_admins` does not
# stop that: it governs pushes and merges, not edits to the protection settings themselves.
#
# That is not hypothetical. Between 2026-09-03 and 2026-09-15, 48 of 57 PRs into `main` came from a
# non-`staging` head; each recorded a red source-branch check and merged anyway, and nobody noticed
# until someone audited the branch graph days later. Between 6 and 18 Nov, five more merges bypassed
# the required checks the same way (bd-mft11s).
#
# So this job checks the RESULT, not the permission. It runs after the push lands. A permission can
# be toggled; a commit graph cannot be quietly rewritten under branch protection, so this can only
# be ignored, and an ignored red run is still a record.
#
#
# WHY THIS COUNTS PROVENANCE — NOT COMMITS, AND NOT TREES EITHER
#
# Counting commits was wrong three times, each time by counting the wrong thing:
#   1. `rev-list staging..main` climbs by one per release for ever (every promotion leaves a merge
#      commit on main that staging lacks). Someone acted on it with a pointless back-merge (9-11).
#   2. `rev-list --no-merges staging..main` still counts SHAs; the same work applied to both
#      branches is two commits, identical content, different SHAs, counted for ever. Read 8 (9-16).
#   3. `git cherry staging main` compares patch-ids; a patch-id comes from the diff, so the same
#      change over different surrounding code hashes differently. Read 2 (9-16), both false.
#
# Comparing TREES was the fix for that — and was right under the OLD model, where `staging` was
# promoted to `main` as a whole branch, so the two trees HAD to match and
# `git merge-tree --write-tree staging main == staging^{tree}` was the invariant, exactly.
#
# That model ended on 2026-11-04 (bd-mft11s). The ladder is now sandbox -> staging -> main by
# per-feature `git cherry-pick -x` (lane B): `main` and `staging` legitimately hold different
# SUBSETS of the same work, often edited to fit each branch's older code, so their trees differ by
# design. The merge-tree check then went red on 155 of 157 pushes to main (6-18 Nov) — correct
# code, wrong question — and an always-red backstop is one nobody reads.
#
# The question is "is every commit on `main` sourced from `staging`", one commit at a time, by the
# same four tests the per-PR gate uses (ancestor / -x trailer / patch-id / byte-identical files).
# That lives in scripts/ci/needs-upstream.sh (tested in tests/setup/needs-upstream.test.js) and is
# wrapped for the whole-branch case by scripts/ci/promotion-invariant.sh (tested in
# tests/setup/promotion-invariant.test.js). An edited lane-B pick passes on its trailer; a commit
# with no source on `staging` fails and is named. promotion-invariant-staging.yml runs the same
# check one rung down.
name: Promotion invariant

on:
  push:
    branches: [main]
  workflow_dispatch:

# No `paths:` filter, deliberately. A required status check with a paths filter NEVER REPORTS on a
# PR that does not match it, and GitHub then holds the PR as "expected — waiting for status" for
# ever. This job must be safe to mark required, so it always runs.

jobs:
  staging-is-the-only-door:
    name: main carries nothing that skipped staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole graph; a shallow clone cannot answer this

      - name: Does main carry content that skipped staging?
        # GitHub's default shell is `bash --noprofile --norc -eo pipefail`. The script sets its own
        # `-uo pipefail` and handles the one expected-non-zero command internally. Verify changes
        # with `bash -eo pipefail`, not plain `bash`.
        shell: bash
        run: |
          set -uo pipefail
          git fetch -q origin staging main
          bash scripts/ci/promotion-invariant.sh origin/staging origin/main
