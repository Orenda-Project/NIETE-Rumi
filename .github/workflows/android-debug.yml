# Android debug build — a testable APK, ON DEMAND. (bd-2553, bd-2723)
#
# The counterpart to android-release.yml. That one ships to Play; this one
# produces the `.debug` APK for on-device testing, so a tester can install a
# build without anyone having a JDK, an Android SDK, and the right vite flag
# on their laptop.
#
# MANUAL ONLY (bd-2723). This used to run on every PR touching `portal/**`,
# which meant a ~25-minute Android toolchain build on changes that no one was
# going to install — the APK is wanted when a tester asks for one, not on
# every push. Run it from Actions → Android Debug Build → Run workflow, and
# pick the branch you want the APK built from in the ref dropdown.
#
# Debug builds install as `pk.edu.niete.debug` and are signed with the generic
# Android debug key, so they sit alongside the production app instead of
# colliding with it (installing over a differently-signed build fails with
# INSTALL_FAILED_UPDATE_INCOMPATIBLE, and the only way through is uninstalling
# the real app).
#
# No secrets are used here — that is deliberate. This can be dispatched
# against any branch, and the release keystore must never be reachable from
# one.

name: Android Debug Build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Absolute portal API URL to build against (blank = staging)'
        required: false
        default: ''

# Two dispatches against the same ref would build the same APK twice.
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # Capacitor 8 hardcodes Java 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Run Android guard tests
        run: |
          npm ci
          npm test -- tests/portal/

      # A debug build points at staging by default so testers cannot generate
      # load or side effects against production data by installing a PR build.
      - name: Write app build config
        working-directory: portal
        env:
          OVERRIDE: ${{ github.event.inputs.api_base_url }}
          STAGING_URL: ${{ vars.NIETE_STAGING_API_BASE_URL }}
        run: |
          API_BASE_URL="${OVERRIDE:-$STAGING_URL}"
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::No absolute https API URL available. Set the repo variable NIETE_STAGING_API_BASE_URL, or pass api_base_url. A native build without one white-screens on every launch (bd-2551)."; exit 1 ;;
          esac
          printf 'VITE_APP_TARGET=app\nVITE_API_BASE_URL=%s\n' "$API_BASE_URL" > .env.app
          echo "API_HOST=$(printf '%s' "$API_BASE_URL" | awk -F[/:] '{print $4}')" >> "$GITHUB_ENV"
          echo "Debug build targets ${API_BASE_URL}"

      - name: Build web assets and sync native project
        working-directory: portal
        env:
          # Debug builds load their BUNDLED assets: a tester needs to verify the
          # code in this PR, not whatever the live server is currently serving.
          NIETE_OTA: '0'
        run: npm run android:sync

      - name: Verify the bundle is app-mode
        working-directory: portal
        run: |
          if ! grep -rqF "$API_HOST" dist/assets/*.js; then
            echo "::error::Built bundle does not reference ${API_HOST} — this is a WEB-mode build and would white-screen (bd-2551)."
            exit 1
          fi
          echo "Bundle references ${API_HOST} — app-mode confirmed."

      - name: Assemble debug APK
        working-directory: portal/android
        run: ./gradlew assembleDebug --no-daemon

      # Downloadable from this run's Summary page:
      #   adb install -r app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: niete-debug-apk
          path: portal/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### NIETE debug APK"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`)"
            echo "- Package: \`pk.edu.niete.debug\` (coexists with prod + staging)"
            echo "- API: \`${API_HOST}\`"
            echo "- Build type: debug, debug-signed, bundled assets (OTA off)"
            echo ""
            echo 'Install: `adb install -r app-debug.apk` — download it from the Artifacts section above.'
          } >> "$GITHUB_STEP_SUMMARY"
