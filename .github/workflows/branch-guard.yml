# Does any tooling still point at a branch we retired?
#
# `develop` was frozen on 2026-09-08 and locked read-only on 2026-09-09. The
# branch model is now `sandbox -> staging -> main`. But the branch NAME was
# hardcoded in about a dozen places, and they went stale one at a time, silently:
#
#   ci.yml                  `branches: [main, develop]` — so `lint`, a REQUIRED
#                           check on staging, never ran on a promotion PR and
#                           those PRs sat BLOCKED for ever on a check that could
#                           never report.
#   android-staging.yml     `branches: [develop]` — the Android staging build
#                           simply stopped firing. Nobody noticed for days.
#   package.json qa:impact  `--base origin/develop` — impact analysis diffed
#                           every change against a frozen branch.
#   select_e2e.py           `origin/develop...HEAD` in the fallback chain — the
#                           E2E selector picked the wrong features to run.
#
# Each was found by hand, late, by a different person. This job is the cheap
# thing that finds the next one immediately. It is a lint, not a policy: it
# fails on a stale reference in TOOLING, where a branch name changes behaviour.
#
# A deliberate reference to `develop` is still legal — a test fixture that
# creates a fake ref, a comment about history. Mark the line:
#
#     # branch-guard-allow: <why>
#
# Prose in docs and CLAUDE.md is not scanned. Those describe history, and
# rewriting history out of a changelog is worse than leaving it.
name: Branch names

on:
  pull_request:
  push:
    branches: [main, staging, sandbox]
  workflow_dispatch:

# No `paths:` filter — see promotion-invariant.yml for why that matters if this
# is ever marked required.

jobs:
  no-stale-branch-refs:
    name: tooling points at a live branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tooling for references to retired branches
        run: |
          set -uo pipefail

          # Where a branch name CHANGES BEHAVIOUR. Docs are deliberately absent.
          PATHS=(
            '.github/workflows'
            'scripts'
            'package.json'
            '.claude/qa/shared'
          )

          PATTERN='origin/develop|branches: *\[ *develop|--base +develop|refs/heads/develop'

          HITS=$(grep -rnE "$PATTERN" "${PATHS[@]}" 2>/dev/null \
                 | grep -v 'branch-guard-allow' \
                 | grep -v '^\.github/workflows/branch-guard\.yml:' || true)

          if [ -z "$HITS" ]; then
            echo "OK — no tooling references a retired branch."
            exit 0
          fi

          echo "::error::Tooling still points at the retired 'develop' branch."
          echo ""
          echo "$HITS" | sed 's/^/  /'
          echo ""
          echo "The branch model is: sandbox -> staging -> main."
          echo "'develop' is frozen and locked; anything keyed on it silently stops working."
          echo ""
          echo "Point it at the branch that now does that job — usually 'sandbox' for"
          echo "work-in-progress and 'staging' for pre-release. If the reference is"
          echo "deliberate (a test fixture, a historical note), append to that line:"
          echo ""
          echo "    # branch-guard-allow: <why>"
          exit 1
