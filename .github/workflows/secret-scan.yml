name: secret-scan

# Blocks any commit/PR that introduces a credential. Runs on every push and PR.
#
# We run the gitleaks CLI binary directly (MIT-licensed, free) rather than the
# gitleaks GitHub Action, because that Action requires a paid license key for
# organization-owned repos. A clone-friendly OSS secret scan must stay free.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned, not "latest". Resolving the latest tag meant an unauthenticated
      # call to api.github.com on every run, under `set -euo pipefail` — so a
      # rate-limit or a transient API error failed this job with ZERO findings
      # and blocked the PR for a non-security reason. That happened on a real PR
      # and passed on a plain re-run minutes later, which is the worst kind of
      # gate: red for reasons nobody can act on.
      #
      # Pinning also makes the scan reproducible — the same commit is scanned by
      # the same detector rules, instead of silently changing under us whenever
      # upstream cuts a release.
      #
      # To bump: pick the new version, then get its digest from
      #   https://github.com/gitleaks/gitleaks/releases/download/v<VER>/gitleaks_<VER>_checksums.txt
      # and update BOTH values below. Do not update the version alone — the
      # checksum check is what makes the pin meaningful rather than decorative.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}" \
            -o "$TARBALL"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$TARBALL"
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --verbose
