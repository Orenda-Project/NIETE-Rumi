name: qa-impact

# Server-side half of the E2E pipeline: Gherkin spec freshness + E2E impact, on every PR into a branch that
# deploys. A TEMPLATE: each bot repo commits a copy at .github/workflows/qa-impact.yml (GitHub reads workflows from
# the repo itself) and edits only the `branches:` list below to its own landing/promotion/release branches.
#
# WHY THIS EXISTS (2026-09-09, bd-c3jx8). The pipeline was "hooks only, no CI" by
# decision on 2026-09-07. Two days later NIETE-Rumi PRs #835 and #836 changed
# bot/shared/services/coaching/** — a mapped feature whose spec needed an update —
# and reached `sandbox` with no spec sync and no E2E, because the git hooks live on
# the developer's machine, exit 0 silently in every failure mode, and a PR merged
# in the GitHub UI never touches a hook at all. Nothing anywhere noticed. The
# operator reversed the decision the same day ("fix everything so the process is
# seamless"). This job is the piece that cannot be skipped by a clone that never
# ran `npm install`.
#
# WHAT IT DOES. Runs impact.py — the SAME analysis the pre-push hook
# prints — over base...head of the PR, with the PR body available for a
# `Spec-Sync: <feature>=none-needed (<why>)` declaration, and posts the result as
# one PR comment that is edited in place (marker: tenants.yaml comment_marker).
#
# THE CHECK RUNS FROM THE REPO'S OWN COPY (bd-9157r.7). A bot repo borrows the engine: on a laptop link-engine.sh
# links it in from the workspace. This machine has only the bot repo, and rumi-agent-home is private, so the files
# this check runs are committed at .github/qa-impact/ — no token, no download. Refresh them on a laptop with the
# engine linked: `bash .claude/qa/engine/bin/ci-copy.sh` (then commit); `--check` says when the copy is behind.
# No copy → the job warns, says the check did not run, and passes: it never blocks a PR for its own setup.
#
#   spec freshness  BLOCK  — a feature's own files changed but its .feature did
#                            not, and nobody declared none-needed  -> job fails
#   e2e proof       WARN   — a runs.jsonl row for the feature in the range; a run
#                            cannot precede the merge it tests, so this is
#                            reported, never blocking (yet)
#
# The comment also carries a "Portal — web lane" table (bd-hnhlgn.9): portal features this PR touched, their
# spec, and whether a web-lane run (`npm run e2e:web` / commit-e2e.sh, runs.jsonl surface "web") was recorded.
# Web rows are reported under the same --proof mode and never fail the Gherkin freshness gate.
#
# A PR touching no mapped bot or portal feature (docs, tests, infra) succeeds quietly
# and posts nothing — so this is safe to mark as a REQUIRED check.
#
# WHAT IT CANNOT DO. Author a scenario or drive WhatsApp. It tells the author, in
# the PR, exactly which `/sync-specs` and E2E command to run in Claude Code.

on:
  pull_request:
    branches: [sandbox, staging, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    name: Gherkin sync + E2E impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the analysis is a commit RANGE (base...head) and a shallow
          # clone cannot resolve it — impact.py would then report "undecidable" and
          # pass, guarding nothing.
          fetch-depth: 0

      - name: The check's own copy of the engine (.github/qa-impact, committed in this repo)
        id: engine
        run: |
          if [ -f .github/qa-impact/impact.py ]; then Q=.github/qa-impact
          elif [ -f .claude/qa/engine/bin/impact.py ]; then Q=.claude/qa/engine/bin   # a repo that vendors the engine
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::There is no .github/qa-impact/ in this repo, so the Gherkin/E2E check did NOT run. On a laptop with the engine linked, run: bash .claude/qa/engine/bin/ci-copy.sh, then commit .github/qa-impact/."
            exit 0
          fi
          if [ -f "$Q/SOURCE" ]; then head -1 "$Q/SOURCE"; fi
          echo "bin=$Q" >> "$GITHUB_OUTPUT"
          echo "have=1" >> "$GITHUB_OUTPUT"
          echo "marker=$(python3 "$Q/tenants_lite.py" --root . --get comment_marker)" >> "$GITHUB_OUTPUT"

      - name: PR body to a file (Spec-Sync declarations may live there)
        if: steps.engine.outputs.have == '1'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"

      - name: Analyse the PR range
        id: impact
        if: steps.engine.outputs.have == '1'
        env:
          BASE_REF: ${{ github.base_ref || 'sandbox' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python3 "${{ steps.engine.outputs.bin }}/impact.py" --repo . \
            --base "origin/$BASE_REF" --head "$HEAD_SHA" \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" --target-branch "$BASE_REF" \
            --format text --freshness block --proof warn \
            --md-out "$RUNNER_TEMP/impact.md" --json-out "$RUNNER_TEMP/impact.json"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          features=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("features") or []))' "$RUNNER_TEMP/impact.json" 2>/dev/null || echo 0)
          echo "features=$features" >> "$GITHUB_OUTPUT"
          web=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("web_features") or []))' "$RUNNER_TEMP/impact.json" 2>/dev/null || echo 0)
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "impact.py exit $rc, $features WhatsApp feature(s), $web portal (web lane) feature(s) affected"
          cat "$RUNNER_TEMP/impact.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: steps.engine.outputs.have == '1' && github.event_name == 'pull_request' && (steps.impact.outputs.features != '0' || steps.impact.outputs.web != '0')
        uses: actions/github-script@v7
        env:
          MD_PATH: ${{ runner.temp }}/impact.md
          MARKER: ${{ steps.engine.outputs.marker }}
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.MARKER || '<!-- qa-impact -->';   // tenants.yaml comment_marker
            const body = fs.readFileSync(process.env.MD_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => (c.body || '').includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate — a Gherkin scenario with no driver fails the PR
        if: steps.engine.outputs.have == '1'
        # Spec freshness proves the .feature CHANGED. It says nothing about whether the scenario can
        # RUN: feature-runner.cjs loads the driver and never opens the spec, so prose alone passes
        # every existing check and executes nothing (bd-bufzl — coaching: 33 @e2e, 15 driven).
        # Enrolment is implicit: an untagged spec reports I-NOTENROLLED and cannot fail, so this is
        # green on arrival and each feature is enrolled deliberately by tagging its scenarios.
        run: |
          set +e
          python3 "${{ steps.engine.outputs.bin }}/check-scenario-coverage.py"
          rc=$?
          if [ "$rc" != "0" ]; then
            echo "::error::A Gherkin scenario has no driver code, so it can never pass, fail or block — it is absent from every run. Append a stub with scaffold-driver.py --sync and implement it, or declare it @no-mock-driver with a reason."
          fi
          exit "$rc"

      - name: Gate — stale Gherkin spec fails the PR
        if: steps.engine.outputs.have == '1'
        run: |
          rc="${{ steps.impact.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::error::A mapped bot or portal feature changed but its Gherkin spec did not (and no Spec-Sync: none-needed declaration). See the PR comment for the exact /sync-specs command."
          fi
          exit "$rc"
