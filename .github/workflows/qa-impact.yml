name: qa-impact

# Server-side half of the NIETE QA pipeline: Gherkin spec freshness + E2E impact,
# on every PR into a branch that deploys.
#
# WHY THIS EXISTS (2026-09-09, bd-c3jx8). The pipeline was "hooks only, no CI" by
# decision on 2026-09-07. Two days later NIETE-Rumi PRs #835 and #836 changed
# bot/shared/services/coaching/** — a mapped feature whose spec needed an update —
# and reached `sandbox` with no spec sync and no E2E, because the git hooks live on
# the developer's machine, exit 0 silently in every failure mode, and a PR merged
# in the GitHub UI never touches a hook at all. Nothing anywhere noticed. The
# operator reversed the decision the same day ("fix everything so the process is
# seamless"). This job is the piece that cannot be skipped by a clone that never
# ran `npm install`.
#
# WHAT IT DOES. Runs .claude/qa/engine/bin/impact.py — the SAME analysis the pre-push hook
# prints — over base...head of the PR, with the PR body available for a
# `Spec-Sync: <feature>=none-needed (<why>)` declaration, and posts the result as
# one PR comment that is edited in place (marker `<!-- niete-qa-impact -->`).
#
#   spec freshness  BLOCK  — a feature's own files changed but its .feature did
#                            not, and nobody declared none-needed  -> job fails
#   e2e proof       WARN   — a runs.jsonl row for the feature in the range; a run
#                            cannot precede the merge it tests, so this is
#                            reported, never blocking (yet)
#
# A PR touching no mapped bot feature (docs, portal, tests, infra) succeeds quietly
# and posts nothing — so this is safe to mark as a REQUIRED check.
#
# WHERE THE ENGINE COMES FROM. It is not in this repo: the harness is shared, authored in
# rumi-agent-home. The first step below clones it with the RUMI_AGENT_HOME_TOKEN secret. Without
# that secret this job cannot analyse anything, and it says so in the job summary instead of
# reporting a pass.
#
# WHAT IT CANNOT DO. Author a scenario or drive WhatsApp. It tells the author, in
# the PR, exactly which `/sync-specs` and `/niete-e2e` to run in Claude Code.

on:
  pull_request:
    branches: [sandbox, staging, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    name: Gherkin sync + E2E impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the analysis is a commit RANGE (base...head) and a shallow
          # clone cannot resolve it — impact.py would then report "undecidable" and
          # pass, guarding nothing.
          fetch-depth: 0

      # The harness is SHARED: authored in hyasin270/rumi-agent-home at .claude/qa/engine, and this
      # repo commits no copy of it (operator, 2026-09-21). CI therefore has to fetch it. With the
      # RUMI_AGENT_HOME_TOKEN secret — a read-only token with contents:read on that repo — this gate
      # runs exactly as it does on a developer machine. Without the secret it CANNOT run, and it says
      # so loudly in the summary rather than passing quietly, which is the failure mode this whole
      # workflow exists to prevent.
      - name: Fetch the shared E2E engine
        id: engine
        env:
          TOKEN: ${{ secrets.RUMI_AGENT_HOME_TOKEN }}
        run: |
          set -u
          if [ -z "${TOKEN:-}" ]; then echo "present=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          AH="$RUNNER_TEMP/agent-home"
          git clone -q --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:$TOKEN@github.com/hyasin270/rumi-agent-home.git" "$AH" \
            || { echo "present=0" >> "$GITHUB_OUTPUT"; exit 0; }
          git -C "$AH" sparse-checkout set .claude/qa/engine >/dev/null 2>&1 || true
          if [ ! -f "$AH/.claude/qa/engine/ENGINE_VERSION" ]; then echo "present=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p .claude/qa && ln -sfn "$AH/.claude/qa/engine" .claude/qa/engine
          echo "present=1" >> "$GITHUB_OUTPUT"
          echo "shared engine $(cat .claude/qa/engine/ENGINE_VERSION)"

      - name: This gate could not run — no shared engine in CI
        if: steps.engine.outputs.present != '1'
        run: |
          {
            echo "### Gherkin sync + E2E impact — NOT RUN"
            echo
            echo "The harness lives in \`hyasin270/rumi-agent-home\` at \`.claude/qa/engine\`, and this repo"
            echo "deliberately commits no copy of it. CI needs a read-only token to read it."
            echo
            echo "Add a repository secret named \`RUMI_AGENT_HOME_TOKEN\` to switch this gate back on."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Gherkin spec-freshness gate did not run: without RUMI_AGENT_HOME_TOKEN, CI cannot read the shared engine."

      - name: PR body to a file (Spec-Sync declarations may live there)
        if: steps.engine.outputs.present == '1'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"

      - name: Analyse the PR range
        id: impact
        if: steps.engine.outputs.present == '1'
        env:
          BASE_REF: ${{ github.base_ref || 'sandbox' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python3 .claude/qa/engine/bin/impact.py --repo . \
            --base "origin/$BASE_REF" --head "$HEAD_SHA" \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" --target-branch "$BASE_REF" \
            --format text --freshness block --proof warn \
            --md-out "$RUNNER_TEMP/impact.md" --json-out "$RUNNER_TEMP/impact.json"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          features=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("features") or []))' "$RUNNER_TEMP/impact.json" 2>/dev/null || echo 0)
          echo "features=$features" >> "$GITHUB_OUTPUT"
          echo "impact.py exit $rc, $features feature(s) affected"
          cat "$RUNNER_TEMP/impact.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: steps.engine.outputs.present == '1' && github.event_name == 'pull_request' && steps.impact.outputs.features != '0'
        uses: actions/github-script@v7
        env:
          MD_PATH: ${{ runner.temp }}/impact.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- niete-qa-impact -->';
            const body = fs.readFileSync(process.env.MD_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => (c.body || '').includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate — stale Gherkin spec fails the PR
        if: steps.engine.outputs.present == '1'
        run: |
          rc="${{ steps.impact.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::error::A mapped bot feature changed but its Gherkin spec did not (and no Spec-Sync: none-needed declaration). See the PR comment for the exact /sync-specs command."
          fi
          exit "$rc"
