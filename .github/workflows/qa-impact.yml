name: qa-impact

# Server-side half of the NIETE QA pipeline: Gherkin spec freshness + E2E impact,
# on every PR into a branch that deploys.
#
# WHY THIS EXISTS (2026-09-09, bd-c3jx8). The pipeline was "hooks only, no CI" by
# decision on 2026-09-07. Two days later NIETE-Rumi PRs #835 and #836 changed
# bot/shared/services/coaching/** — a mapped feature whose spec needed an update —
# and reached `sandbox` with no spec sync and no E2E, because the git hooks live on
# the developer's machine, exit 0 silently in every failure mode, and a PR merged
# in the GitHub UI never touches a hook at all. Nothing anywhere noticed. The
# operator reversed the decision the same day ("fix everything so the process is
# seamless"). This job is the piece that cannot be skipped by a clone that never
# ran `npm install`.
#
# WHAT IT DOES. Runs scripts/qa/impact.py — the SAME analysis the pre-push hook
# prints — over base...head of the PR, with the PR body available for a
# `Spec-Sync: <feature>=none-needed (<why>)` declaration, and posts the result as
# one PR comment that is edited in place (marker `<!-- niete-qa-impact -->`).
#
#   spec freshness  BLOCK  — a feature's own files changed but its .feature did
#                            not, and nobody declared none-needed  -> job fails
#   e2e proof       WARN   — a runs.jsonl row for the feature in the range; a run
#                            cannot precede the merge it tests, so this is
#                            reported, never blocking (yet)
#
# A PR touching no mapped bot feature (docs, portal, tests, infra) succeeds quietly
# and posts nothing — so this is safe to mark as a REQUIRED check.
#
# WHAT IT CANNOT DO. Author a scenario or drive WhatsApp. It tells the author, in
# the PR, exactly which `/sync-specs` and `/niete-e2e` to run in Claude Code.

on:
  pull_request:
    branches: [sandbox, staging, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    name: Gherkin sync + E2E impact
    runs-on: ubuntu-latest
    outputs:
      rc: ${{ steps.impact.outputs.rc }}
      features: ${{ steps.impact.outputs.features }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the analysis is a commit RANGE (base...head) and a shallow
          # clone cannot resolve it — impact.py would then report "undecidable" and
          # pass, guarding nothing.
          fetch-depth: 0

      - name: PR body to a file (Spec-Sync declarations may live there)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"

      - name: Analyse the PR range
        id: impact
        env:
          BASE_REF: ${{ github.base_ref || 'sandbox' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python3 scripts/qa/impact.py --repo . \
            --base "origin/$BASE_REF" --head "$HEAD_SHA" \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" --target-branch "$BASE_REF" \
            --format text --freshness block --proof warn \
            --md-out "$RUNNER_TEMP/impact.md" --json-out "$RUNNER_TEMP/impact.json"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          features=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("features") or []))' "$RUNNER_TEMP/impact.json" 2>/dev/null || echo 0)
          echo "features=$features" >> "$GITHUB_OUTPUT"
          echo "impact.py exit $rc, $features feature(s) affected"
          cat "$RUNNER_TEMP/impact.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: github.event_name == 'pull_request' && steps.impact.outputs.features != '0'
        uses: actions/github-script@v7
        env:
          MD_PATH: ${{ runner.temp }}/impact.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- niete-qa-impact -->';
            const body = fs.readFileSync(process.env.MD_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => (c.body || '').includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate — stale Gherkin spec fails the PR
        run: |
          rc="${{ steps.impact.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::error::A mapped bot feature changed but its Gherkin spec did not (and no Spec-Sync: none-needed declaration). See the PR comment for the exact /sync-specs command."
          fi
          exit "$rc"

  # ── AUTHOR THE STALE SPEC ON THE RUNNER (bd-2a07j) ──────────────────────────
  # The check above can only JUDGE. Authoring a scenario is a judgement call the
  # repo already delegates to a model following .claude/skills/gherkin-spec-sync —
  # until now only a Claude Code session on the developer's laptop could run it,
  # and PRs #835/#836/#841 showed how often that never happens. This job runs the
  # SAME skill, in the same repo, on the runner, and pushes the authored .feature
  # back onto the PR branch. That push re-triggers the check, which then passes.
  #
  # Needs two repository secrets (a repo admin adds them; the job explains itself
  # and stops when they are missing — the PR stays red, nothing else changes):
  #   ANTHROPIC_API_KEY   for Claude Code on the runner
  #   QA_BOT_TOKEN        a fine-grained PAT with contents:write on this repo. The
  #                       default GITHUB_TOKEN can push, but GitHub does not run
  #                       workflows for commits it pushes — so the re-check would
  #                       never happen and the PR would stay red on the new commit.
  # Guards: same-repo PRs only (fork PRs get no secrets and cannot be pushed to);
  # never authors on top of its own commit (scripts/qa/spec-autosync.sh guard);
  # one run at a time per PR; a hard 30-minute cap on the model.
  autosync:
    name: Author the stale Gherkin (Claude)
    needs: impact
    if: >-
      always() && needs.impact.result != 'skipped'
      && needs.impact.outputs.rc != '0'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: qa-autosync-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Secrets present?
        id: secrets
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT: ${{ secrets.QA_BOT_TOKEN }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice title=qa-autosync skipped::ANTHROPIC_API_KEY is not set on this repository, so the stale spec cannot be authored here. A repo admin adds it under Settings → Secrets → Actions; until then run /sync-specs in Claude Code (see the PR comment)."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BOT" ]; then
            echo "::warning title=qa-autosync will push with GITHUB_TOKEN::QA_BOT_TOKEN is not set. The authored commit will be pushed, but GitHub does not run checks for commits pushed by GITHUB_TOKEN — re-run the qa-impact check by hand (or push an empty commit) after it lands."
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.go == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.QA_BOT_TOKEN || github.token }}

      - name: Loop guard — never author on top of an auto-sync commit
        if: steps.secrets.outputs.go == 'true'
        id: guard
        run: |
          set +e
          bash scripts/qa/spec-autosync.sh guard --repo . --head HEAD; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = 2 ] && echo "::notice title=qa-autosync stopped::HEAD is already an auto-sync commit and the spec is still judged stale — a human needs to look (or declare Spec-Sync: none-needed)."
          exit 0

      - name: Build the brief for this PR's range
        if: steps.secrets.outputs.go == 'true' && steps.guard.outputs.rc == '0'
        id: brief
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          bash scripts/qa/spec-autosync.sh brief --repo . --base "origin/$BASE_REF" --head HEAD --out "$RUNNER_TEMP/brief.json"; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] && echo "features=$(bash scripts/qa/spec-autosync.sh features --brief "$RUNNER_TEMP/brief.json")" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/setup-node@v4
        if: steps.brief.outputs.rc == '0'
        with:
          node-version: 22

      - name: Author through the gherkin-spec-sync skill (Claude Code, headless)
        if: steps.brief.outputs.rc == '0'
        id: author
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_AUTORUN_OFF: "1"          # no E2E can run here; keep the session's hooks quiet
          FEATURES: ${{ steps.brief.outputs.features }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          cp "$RUNNER_TEMP/brief.json" ./.qa-autosync-brief.json
          PROMPT="/sync-specs --brief ./.qa-autosync-brief.json
          
          You are running unattended on a GitHub Actions runner for a pull request. Author
          PHASE 1 ONLY: bring tests/features/whatsapp/niete/{$FEATURES}.feature in line with the
          diff in the brief, following the gherkin-spec-sync skill exactly and authoring
          through gherkin-test-cases. Never delete a scenario (tag @obsolete with a reason).
          Then run: python3 .claude/qa/shared/validate_specs.py --only $FEATURES — and fix
          until it passes. If a scenario count changed, update the counts in
          .claude/commands/niete-e2e.md. Do NOT run /niete-e2e, do NOT git commit, do NOT
          git push, do NOT edit anything outside tests/features/ and niete-e2e.md, and do
          not ask questions — nobody is watching. End by listing what you changed."
          claude -p "$PROMPT" --dangerously-skip-permissions --max-turns 60 </dev/null | tail -60
          rm -f ./.qa-autosync-brief.json

      - name: Validate, commit only the specs, push to the PR branch
        if: steps.brief.outputs.rc == '0'
        id: commit
        env:
          FEATURES: ${{ steps.brief.outputs.features }}
        run: |
          set +e
          git checkout -- . ':!tests/features' ':!.claude/commands/niete-e2e.md' 2>/dev/null   # anything else the model touched is discarded
          bash scripts/qa/spec-autosync.sh commit --repo . --features "$FEATURES" --head HEAD; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "::notice title=qa-autosync::Authored and pushed the $FEATURES spec update. The qa-impact check re-runs on the new commit." ;;
            1) echo "::error title=qa-autosync::The authored spec did not pass validate_specs.py — nothing was committed. Run /sync-specs in Claude Code." ;;
            3) echo "::warning title=qa-autosync::Claude changed no spec file. Either the change is spec-neutral — declare it with a Spec-Sync: trailer — or run /sync-specs by hand." ;;
          esac
          exit 0

      - name: Tell the PR what happened
        if: steps.secrets.outputs.go == 'true'
        uses: actions/github-script@v7
        env:
          GUARD_RC: ${{ steps.guard.outputs.rc }}
          BRIEF_RC: ${{ steps.brief.outputs.rc }}
          COMMIT_RC: ${{ steps.commit.outputs.rc }}
          FEATURES: ${{ steps.brief.outputs.features }}
        with:
          script: |
            const marker = '<!-- niete-qa-autosync -->';
            const { GUARD_RC, BRIEF_RC, COMMIT_RC, FEATURES } = process.env;
            let body;
            if (GUARD_RC === '2') body = `${marker}\n### 🤖 Gherkin auto-sync — stopped\nThe last commit is already an auto-sync commit and the spec is still judged stale. Not authoring on top of authoring: a human needs to look, or declare \`Spec-Sync: <feature>=none-needed (<why>)\`.`;
            else if (BRIEF_RC === '3') body = `${marker}\n### 🤖 Gherkin auto-sync — nothing to author\nThe range touches no feature whose own spec needs authoring.`;
            else if (COMMIT_RC === '0') body = `${marker}\n### 🤖 Gherkin auto-sync — authored **${FEATURES}**\nClaude Code ran the repo's \`gherkin-spec-sync\` skill on the runner, validated with \`validate_specs.py\`, and pushed the \`.feature\` update to this branch. **Review it like code** — it describes what this change is claimed to do. The \`qa-impact\` check re-runs on the new commit.`;
            else if (COMMIT_RC === '1') body = `${marker}\n### 🤖 Gherkin auto-sync — validator refused\nClaude authored a change to **${FEATURES}** but \`validate_specs.py\` rejected it, so nothing was committed. Run \`/sync-specs ${FEATURES}\` in Claude Code.`;
            else if (COMMIT_RC === '3') body = `${marker}\n### 🤖 Gherkin auto-sync — no spec change produced\nClaude judged nothing to author for **${FEATURES}**, or failed to. If the change is spec-neutral, declare it: \`Spec-Sync: ${FEATURES}=none-needed (<why>)\` in the PR body. Otherwise run \`/sync-specs ${FEATURES}\` in Claude Code.`;
            else body = `${marker}\n### 🤖 Gherkin auto-sync — did not complete\nSee the workflow log.`;
            const { owner, repo } = context.repo; const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => (c.body || '').includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

