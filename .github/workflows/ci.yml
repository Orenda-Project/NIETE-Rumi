name: CI

# `develop` is the staging branch every change must pass through before `main`,
# so it needs the same gate — previously this ran on `main` only, which meant a
# PR into `develop` had no test check at all (gitleaks was the only one).
#
# NOTE: this workflow is currently disabled and its suite has a pre-existing
# failure backlog. Re-enabling it before that backlog is quarantined would make
# every PR red, which is how it came to be disabled in the first place. The
# logger-severity ratchet therefore runs in its own fast workflow
# (`logger-level.yml`) that is green today and can stay enabled.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Verify no hardcoded credentials
        run: |
          # Check for common credential patterns in source files. The `!` in
          # front of the grep inverts the exit code: grep returns 0 on a hit
          # (which means the credential leaked), and the `!` flips that to a
          # non-zero exit so the step fails. The trailing `|| true` was a
          # defensive mistake that silently masked any hit; removed so a
          # real leak now actually fails CI.
          ! grep -rn 'EAAUmy\|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.' \
            --include='*.js' --include='*.ts' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.git \
            bot/shared/ dashboard/ portal/ scripts/ infrastructure/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Check for security patterns
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=0
          # Check for API keys
          if grep -rn 'sk-[a-zA-Z0-9]\{20,\}' --include='*.js' --exclude-dir=node_modules --exclude='*.test.js' bot/shared/ dashboard/services/ 2>/dev/null; then
            echo "WARNING: Possible API key found"
            FOUND=1
          fi
          # Check for personal paths
          if grep -rn '/Users/' --include='*.js' --include='*.sh' --exclude-dir=node_modules bot/ dashboard/ 2>/dev/null; then
            echo "WARNING: Personal path found"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "Security check found potential issues. Review above."
            exit 1
          fi
          echo "Security check passed."
