name: data-standards

# Schema gate for the Data Standards (D1-D27).
#
# WHY THERE IS NO `paths:` FILTER
# ------------------------------
# The obvious shape for this workflow is `pull_request: paths: ['**/*.sql', ...]`.
# That is wrong here, for two reasons, and both only bite later:
#
#   1. A required status check with a `paths:` filter NEVER REPORTS on a PR that
#      doesn't match it. GitHub then holds the PR as "expected — waiting for
#      status", forever. So the moment anyone marks this check required (the whole
#      point of building it), every non-schema PR in the repo wedges.
#   2. A hand-maintained glob list is a second, drifting definition of "is this
#      change schema-relevant". The skill already owns that definition, in
#      `.data-standards.json` + its own detector. Two copies disagree eventually,
#      and the disagreement shows up as a violation that slipped one gate and got
#      caught confusingly late by another — exactly what the skill's
#      reference/detection-guidance.md warns against.
#
# So: run on EVERY pull request, and let the skill's own detector decide whether
# there is anything to say. Nothing relevant changed -> the job succeeds quietly
# and posts no comment. That is safe to make a required check, and there is no
# path list to forget to update.
#
# ADVISORY, FOR NOW
# -----------------
# The `report` job never fails the build. Two known upstream detection gaps make
# blocking premature, both measured against this repo:
#   1. The D8 destructive check does not strip SQL comments, so a commented-out
#      rollback line (`-- DROP TABLE IF EXISTS x;`) reads as live destructive SQL.
#      23 of our 85 findings are this — 27%.
#   2. D4's PII pattern is `\b(phone|cnic|email|dob)\b`, and `_` is a word
#      character, so `parent_phone` / `teacher_phone` / `work_email` are NOT
#      detected. 3 of our 6 real PII column names are invisible to it.
# Both live in the Data Team's skill, which this repo vendors verbatim and does
# not patch. Drop `continue-on-error` once upstream addresses them.
#
# The `ownership` job is NOT advisory — it fails hard. It proves nobody edited the
# vendored skill, which is the entire basis for calling it the Data Team's.
#
# SLACK NOTIFICATION (added — see the "Notify Slack on a confirmed violation"
# step in the `report` job below). Mirrors the Data Team's own Claude-gate
# behavior: a confirmed finding (exit 1) posts to Slack. Needs SLACK_BOT_TOKEN
# and TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL as repository secrets to
# actually deliver — see that step's own comment for exactly what happens if
# either is missing (nothing breaks; it just doesn't send).

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ownership:
    name: vendored skill is verbatim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the vendored skill matches its receipt
        run: ./scripts/data-standards-verify.sh

  # This PR relaxes one rule in tests/setup/source-hygiene.test.js — the org name
  # is permitted inside the vendored skill directory, because their docs use it and
  # we cannot edit their files. Five assertions pin how narrow that hole is.
  #
  # `ci.yml` is disabled repo-wide (its own header explains why: a pre-existing
  # failure backlog), so that guard runs in NO workflow today — meaning the
  # assertions protecting the hole would never execute in CI. This job runs exactly
  # those five, by name, so the rest of the suite's known failures are not inherited
  # and this stays green and meaningful. Widen the exemption and this goes red.
  exemption:
    name: hygiene exemption stays narrow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm ci
      - name: Assert the vendored-skill exemption is org-name-only
        run: node tests/run.js --testPathPattern="source-hygiene" -t "vendored-skill exemption"

  report:
    name: schema findings (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the real merge-base, not a shallow clone

      # `github.event.pull_request.base.sha` is the base branch's CURRENT TIP, not
      # the merge base. Diffing tip..head therefore drags in every commit that
      # landed on the base branch after this PR was cut, and reports those files as
      # if this PR had changed them. Caught live on PR #320: it attributed two
      # other people's migrations to a PR that touches no schema file at all, and
      # said so in the comment. `git merge-base` is the actual fork point, which is
      # why this job needs fetch-depth: 0 above.
      - name: Resolve base..head
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            head="${{ github.event.pull_request.head.sha }}"
            tip="${{ github.event.pull_request.base.sha }}"
            base=$(git merge-base "$tip" "$head")
            echo "Base tip: $tip"
            echo "Merge base (used): $base"
          else
            head="${{ github.sha }}"
            base="${{ github.event.before }}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # The skill's own detector is the single source of "is this relevant",
      # driven by .data-standards.json. No glob list lives in this workflow.
      - name: Is anything schema-relevant in this diff?
        id: scope
        run: |
          python3 .claude/skills/data-standards/scripts/detect_schema_changes.py \
            --git-diff "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}" \
            > detect.json
          n=$(python3 -c "import json;print(len(json.load(open('detect.json'))['relevant']))")
          a=$(python3 -c "import json;print(len(json.load(open('detect.json'))['ambiguous']))")
          echo "relevant=$n" >> "$GITHUB_OUTPUT"
          echo "ambiguous=$a" >> "$GITHUB_OUTPUT"
          echo "Schema-relevant files in this diff: $n (ambiguous: $a)"
          python3 -c "
          import json;d=json.load(open('detect.json'))
          [print('  relevant :',x['path']) for x in d['relevant']]
          [print('  AMBIGUOUS:',x['path'],'-',x.get('reason','')) for x in d['ambiguous']]"

      # Only from here on does this job cost anything. The detector above is
      # stdlib-only and runs in ~0.03s, so a PR that touches no schema file pays a
      # checkout and nothing else — no Python setup, no pip install. That is what
      # makes "run on every PR" cheap enough to also be the required check.
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.relevant != '0'
        with:
          python-version: '3.11'

      # The validator hard-exits 2 without pyyaml, and every gate treats exit 2 as
      # blocking — a missing dependency would otherwise read as a schema violation.
      - name: Install pyyaml
        if: steps.scope.outputs.relevant != '0'
        run: pip install pyyaml

      - name: Validate changed schema files
        id: validate
        if: steps.scope.outputs.relevant != '0'
        continue-on-error: true
        run: |
          set +e
          python3 .claude/skills/data-standards/scripts/validate_schema.py \
            --mode diff --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" > report.json 2>err.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          python3 .claude/skills/data-standards/scripts/validate_schema.py \
            --mode diff --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" --markdown > report.md 2>/dev/null
          echo "--- exit $code (0=pass 1=findings 2=validator error 3=no schema change) ---"
          # Deliberately no exit-code mask on these reads:
          # tests/setup/ci-workflow-no-silent-masks.test.js forbids that pattern in
          # a workflow, correctly — it hides the failure a step was added to catch.
          # Guard the reads with a file test instead.
          if [ -f report.md ]; then cat report.md; fi
          if [ -s err.txt   ]; then cat err.txt;   fi
          # Exit with the validator's real code so the step's status tells the
          # truth in the UI, and let `continue-on-error` above absorb it rather
          # than faking a green with `exit 0`. Findings show as a visible warning;
          # the job still proceeds to comment.
          exit "$code"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-standards-report
          path: |
            detect.json
            report.json
            report.md
          retention-days: 30
          if-no-files-found: ignore

      # Comment only when there is something to say. A PR that touches no schema
      # file gets no comment at all — but the check still reports, so this is safe
      # to require. An `ambiguous` file is surfaced even with no findings: the
      # detector could not tell schema from data dump, so silence would be a lie.
      # Runs even when nothing is relevant. It must: post nothing on a PR that has
      # no schema change AND no prior comment, but CORRECT a prior comment if one
      # exists — otherwise a comment from an earlier push stays visible and lies
      # about the current state (e.g. after a fix removes the last schema file).
      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const code = '${{ steps.validate.outputs.exit_code }}';
            const nRel = '${{ steps.scope.outputs.relevant }}';
            const nAmb = '${{ steps.scope.outputs.ambiguous }}';
            const marker = '<!-- data-standards -->';

            const findExisting = async () => {
              const { data } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              return data.find(c => c.body && c.body.includes(marker));
            };

            if (nRel === '0' && nAmb === '0') {
              const stale = await findExisting();
              if (!stale) return;                     // nothing to say, nothing to correct
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: stale.id,
                body: [marker, '### Data standards — advisory',
                       'This PR no longer changes any schema file in scope. Nothing to report.'].join('\n'),
              });
              return;
            }
            const head =
              code === '1' ? `Findings on ${nRel} schema file(s) this PR touches. **Advisory — does not block the merge.** About a quarter of D8 findings are known false positives (commented-out SQL read as live destructive statements).`
              : code === '2' ? 'The validator could not run — see the job log.'
              : `No findings on the ${nRel} schema file(s) this PR touches.`;
            const amb = nAmb !== '0'
              ? `\n\n⚠️ ${nAmb} file(s) could not be classified as schema vs. data dump — see \`detect.json\` in the run artifacts.`
              : '';
            const body = [marker, '### Data standards — advisory', head + amb, '',
              fs.existsSync('report.md') ? fs.readFileSync('report.md', 'utf8') : ''].join('\n');
            const existing = await findExisting();
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # Mirrors the Claude gate's own validation_failure Slack event, so a
      # finding caught here (a plain terminal commit, or any PR the Claude gate
      # in someone's local session never saw) reaches the Data Team the same
      # way a Claude-session violation already does. Only fires on a CONFIRMED
      # finding (exit 1) — not on exit 2 (validator error), which is a CI/infra
      # problem for whoever's watching Actions, not a data-standards finding.
      #
      # This step deliberately does NOT gate the job (this workflow is
      # advisory-only today, per the header above) and continue-on-error is
      # set so even an outright failure here can never turn this into a
      # blocking step later by accident.
      #
      # Needs two repository secrets to actually deliver — Settings → Secrets
      # and variables → Actions:
      #   SLACK_BOT_TOKEN                          (from TOKENS.md)
      #   TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL  (the target channel ID)
      # Without them, notify.py still runs and exits 0, reporting "not sent" —
      # same never-block guarantee as every other call site for this script.
      - name: Notify Slack on a confirmed violation
        if: steps.validate.outputs.exit_code == '1'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL: ${{ secrets.TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL }}
        run: |
          python3 .claude/skills/data-standards/scripts/notify.py slack \
            --event validation_failure \
            --repo "${{ github.repository }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --commit "${{ steps.refs.outputs.head }}" \
            --actor "${{ github.actor }}" \
            --result "FAIL (CI, advisory)" \
            --pr "${{ github.event.pull_request.html_url || '' }}"
