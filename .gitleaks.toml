# Gitleaks configuration for the Rumi Platform OSS repo.
# Goal: block any real secret (yours OR a contributor's) from ever being committed.
# We extend gitleaks' default ruleset and add a few explicit key SHAPES.
#
# IMPORTANT: this file contains only generic key *patterns*, never any real key,
# project ref, or phone number. The deployment-specific denylist (an operator's
# own Supabase ref, phone numbers, etc.) is intentionally NOT here — those values
# must never live in this public repo in the first place.

title = "Rumi Platform secret scan"

[extend]
useDefault = true

# --- Explicit key shapes (defense in depth over the default rules) ----------

[[rules]]
id = "openrouter-key"
description = "OpenRouter API key"
regex = '''sk-or-v1-[0-9a-fA-F]{32,}'''

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[a-zA-Z0-9_-]{24,}'''

[[rules]]
id = "supabase-access-token"
description = "Supabase personal/access token"
regex = '''sbp_[0-9a-fA-F]{40,}'''

[[rules]]
id = "google-api-key"
description = "Google / Gemini API key"
regex = '''AIza[0-9A-Za-z_\-]{35}'''

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'''

[[rules]]
id = "credential-assignment-uuid"
description = "UUID assigned to a credential variable (e.g. RAILWAY_ACCOUNT_TOKEN=<uuid>)"
# Bare UUIDs aren't in gitleaks' default ruleset, so a token-shaped UUID would
# otherwise sail through — this is exactly what leaked in dashboard/docs.
regex = '''(?i)(?:token|secret|password|api[_-]?key|access[_-]?token|account[_-]?token|service[_-]?role[_-]?key)["']?\s*[:=]\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''

[[rules]]
id = "credential-assignment-longtoken"
description = "Long contiguous high-entropy value assigned to a credential variable"
regex = '''(?i)(?:token|secret|password|api[_-]?key|access[_-]?token|account[_-]?token|service[_-]?role[_-]?key)["']?\s*[:=]\s*["']?[A-Za-z0-9]{32,}'''

# --- Allowlist: placeholders, tests, this config ----------------------------
# NOTE: docs/ is intentionally NOT path-allowlisted — docs MUST be scanned for real
# secrets (a live token leaked into dashboard/docs once). Placeholders in docs are
# covered by the regex allowlist below instead.

# NOTE: the plural `[[allowlists]]` form is required — gitleaks refuses a config
# that mixes the deprecated singular `[allowlist]` with `[[allowlists]]`
# ("[allowlist] is deprecated, it cannot be used alongside [[allowlists]]"), and a
# second, narrowly-scoped allowlist is added below. Same semantics, same content.
[[allowlists]]
description = "Template placeholders, test fixtures, and this config are not leaks"
paths = [
  '''\.env\.template$''',
  '''\.env\.example$''',
  '''(^|/)tests/''',
  '''(^|/)__tests__/''',
  '''\.test\.js$''',
  '''\.gitleaks\.toml$''',
  '''(^|/)bot/fonts/''',
]
regexes = [
  '''your-[a-z-]*-?(key|token|id|secret)''',
  '''<[a-z][a-z0-9 _-]*>''',
  '''sk-or-v1-\.\.\.''',
  '''(?i)CHANGEME''',
  '''(?i)need-to-get''',
  '''example\.com''',
  '''your-project\.supabase\.co''',
  '''YOUR_[A-Z_]+''',
]

# --- Our own Postgres identifiers, named in prose -----------------------------
#
# The default `generic-api-key` rule fires on a KEYWORD followed by a quoted
# high-entropy-looking value. A comment explaining a schema decision does exactly
# that, in ordinary English:
#
#   "segment_id is the primary key, `niete_lp612_renders` carries a foreign key to it"
#
# gitleaks captures `niete_lp612_renders` as the secret (entropy 3.51) because it
# follows the word "key,". It is a TABLE NAME, it is in the public schema file,
# and it cannot be a credential.
#
# This had turned the scanner permanently red — every PR from #574 onward failed
# on this one finding. That is worse than the false positive itself: a check that
# is always red teaches everyone to merge through red, so the next finding (a real
# one) gets waved through too. Fixing it is a security change, not a cosmetic one.
#
# Kept deliberately narrow rather than disabling the rule or path-excluding the
# file:
#   * targetRules  — only `generic-api-key`; every explicit key-shape rule above
#                    (Anthropic, OpenRouter, Supabase, Google, OpenAI) is untouched.
#   * regexTarget  — matched against the captured SECRET, not the whole line, so
#                    a real key sitting on the same line is still reported.
#   * the regex    — only our `niete_`-prefixed snake_case identifiers. Real keys
#                    from every vendor we use carry mixed case, digits and dashes,
#                    so none of them can match this shape.
[[allowlists]]
description = "Our own niete_* Postgres identifiers discussed in comments are not secrets"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^niete_[a-z0-9_]+$''',
]
